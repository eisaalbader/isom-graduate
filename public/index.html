:root{
  --maroon:#660000;
  --bg:#F5F5F5;
  --card:#FFFFFF;
  --rule:#DCD7D6;
  --ink:#2E2726;
  --ink-soft:#7D7270;
  --ink-faint:#ADA3A1;

  
  --c-core:#660000;        
  --c-analytics:#0E6E63;   
  --c-appdev:#1F4E79;      
  --c-elective:#A9741A;    
  --c-support:#55632B;     
  --c-lang:#1F4E79;        
  --c-math:#0E6E63;        
  --c-acct:#8A5E14;        
  --c-econ:#9C4614;        
  --c-biz:#5B3A72;         

  --wire:#9A8F8D;
  --wire-hard:#8C4A4A;
  --gap:4mm;
  --pad:14mm;
  --radius:2mm;
}
*{box-sizing:border-box}
.stage .page{
  position:relative;width:594mm;height:420mm;
  background:var(--bg);padding:var(--pad);
  overflow:hidden;display:flex;flex-direction:column;
  page-break-after:always;margin:0 auto;
}
.stage .wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.stage .wm img{position:absolute;display:block;mix-blend-mode:multiply}
.stage .wm .g1{left:-26mm;top:120mm;width:138mm;opacity:.075}
.stage .wm .g2{right:-18mm;top:58mm;width:90mm;opacity:.055}
.stage .wm .g3{left:150mm;bottom:-30mm;width:110mm;opacity:.085}
.stage .wm .g4{right:120mm;top:26mm;width:50mm;opacity:.045}
.stage .wm .g5{left:40mm;bottom:96mm;width:62mm;opacity:.06}
.stage .wm .m1{right:26mm;bottom:38mm;width:200mm;opacity:.08}
.stage .wm .m2{left:-34mm;top:18mm;width:124mm;opacity:.05}
.stage .hd{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:3.2mm;margin-bottom:4mm;
  border-bottom:.6mm solid var(--maroon);
}
.stage .hd__club{height:30mm;width:auto;display:block}
.stage .hd__crest{height:46mm;width:auto;display:block}
.stage .hd__titles{
  position:absolute;left:calc(60mm + 6mm + 26mm + 4mm);right:0;
  text-align:center;pointer-events:none;
}
.stage .hd__en{
  font-family:BarlowC;font-weight:700;font-style:italic;
  font-size:30pt;line-height:1;color:var(--maroon);
  text-transform:uppercase;letter-spacing:.005em;margin:0;
}
.stage .hd__ar{
  font-family:Cairo;font-weight:700;font-size:23pt;color:var(--ink);
  direction:rtl;line-height:1.3;margin-top:1mm;
}
.stage .hd__meta{
  font-family:DMSans;font-weight:500;font-size:9pt;color:var(--ink-soft);
  margin-top:1.6mm;letter-spacing:.1em;text-transform:uppercase;
}
.stage .body{position:relative;flex:1;display:flex;gap:6mm;min-height:0}
.stage .rail{width:60mm;flex:none;display:flex;flex-direction:column;gap:4mm}
.stage .canvas{flex:1;position:relative;min-width:0}
.stage .panel{position:relative;z-index:2;background:rgba(255,255,255,.93);border-radius:var(--radius);padding:3.4mm 4mm;border:.25mm solid var(--rule)}
.stage .panel--accent{border-left:1.4mm solid var(--maroon)}
.stage .panel__h{font-family:Aleo;font-weight:700;font-size:10pt;color:var(--maroon);margin:0}
.stage .panel__h-ar{font-family:Cairo;font-weight:700;font-size:10pt;color:var(--maroon);direction:rtl;text-align:right;margin:0 0 2mm}
.stage .steps{counter-reset:s;margin:0;padding:0;list-style:none}
.stage .steps li{
  counter-increment:s;position:relative;padding-left:6.4mm;margin-bottom:1.8mm;
  font-family:Aleo;font-size:8.4pt;line-height:1.3;color:var(--ink);
}
.stage .steps li::before{
  content:counter(s);position:absolute;left:0;top:.1mm;
  width:4.6mm;height:4.6mm;border-radius:50%;background:var(--maroon);color:#fff;
  font-family:DMSans;font-weight:700;font-size:6.4pt;
  display:flex;align-items:center;justify-content:center;
}
.stage .steps li .ar{
  display:block;font-family:Tajawal;font-size:8.4pt;color:#554C4A;
  direction:rtl;text-align:right;margin-top:.5mm;line-height:1.5;
}
.stage .key{display:flex;flex-direction:column;gap:1.7mm}
.stage .key__row{display:flex;align-items:center;gap:2.8mm}
.stage .key__chip{
  min-width:11mm;height:5.6mm;border-radius:1.2mm;flex:none;padding:0 1.8mm;
  display:flex;align-items:center;justify-content:center;
  font-family:DMSans;font-weight:700;font-size:5.6pt;color:#fff;letter-spacing:.05em;
  white-space:nowrap;
}
.stage .key__sw{width:6.4mm;height:6.4mm;border-radius:1.2mm;flex:none}
.stage .key__txt{min-width:0}
.stage .key__en{font-family:Aleo;font-weight:700;font-size:8.2pt;line-height:1.22;display:block}
.stage .key__ar{font-family:Tajawal;font-size:8.2pt;color:#554C4A;direction:rtl;text-align:right;display:block;line-height:1.45}
.stage .key__wire{width:12mm;height:0;border-top:.55mm solid var(--wire-hard);flex:none}
.stage .grid{
  position:relative;height:100%;
  display:grid;
  grid-template-columns:26mm repeat(8,1fr);
  column-gap:var(--gap);row-gap:5mm;
  grid-auto-rows:min-content;
  align-content:space-between;
}
.stage .stripe{
  grid-column:1/10;z-index:0;border-radius:var(--radius);
  background:var(--tint);pointer-events:none;mix-blend-mode:multiply;
}
.stage .band{
  grid-column:1;z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:var(--radius);background:var(--tint-strong);
  padding:2mm 1mm;
}
.stage .band__l{
  font-family:DMSans;font-weight:700;font-size:6pt;letter-spacing:.14em;
  text-transform:uppercase;color:var(--band-ink);line-height:1;
}
.stage .band__n{
  font-family:BarlowC;font-weight:700;font-size:30pt;line-height:.92;
  color:var(--band-ink);margin:.6mm 0;
}
.stage .band__ar{font-family:Tajawal;font-weight:500;font-size:7.4pt;color:var(--band-ink);line-height:1;opacity:.85}
.stage .zone{
  z-index:1;border-radius:3.4mm;pointer-events:none;position:relative;
  margin:-4.5mm -4.5mm -4.5mm;background:rgba(255,255,255,.42);
}
.stage .zone--analytics{border:.75mm solid var(--c-analytics);box-shadow:0 0 0 1.1mm rgba(14,110,99,.10)}
.stage .zone--appdev{border:.75mm solid var(--c-appdev);box-shadow:0 0 0 1.1mm rgba(31,78,121,.10)}
.stage .ztag{
  grid-column:span 3;z-index:3;display:flex;align-items:baseline;gap:2.6mm;
  padding:0 1mm 1mm;
}
.stage .ztag__n{
  font-family:DMSans;font-weight:700;font-size:6pt;color:#fff;
  padding:.8mm 2.2mm;border-radius:9mm;letter-spacing:.08em;
}
.stage .ztag__en{font-family:Aleo;font-weight:700;font-size:10pt;line-height:1}
.stage .ztag__ar{font-family:Cairo;font-weight:700;font-size:9.5pt;direction:rtl;line-height:1}
.stage .ztag__sub{
  display:block;font-family:DMSans;font-weight:500;font-size:6.4pt;
  color:var(--ink-soft);letter-spacing:.02em;
}
.stage .ztag--analytics .ztag__n{background:var(--c-analytics)}
.stage .ztag--analytics .ztag__en,.stage .ztag--analytics .ztag__ar{color:var(--c-analytics)}
.stage .ztag--appdev .ztag__n{background:var(--c-appdev)}
.stage .ztag--appdev .ztag__en,.stage .ztag--appdev .ztag__ar{color:var(--c-appdev)}
.stage .orbox{
  z-index:4;justify-self:center;width:66%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:1mm;padding:3mm 2mm;
  border:.45mm dashed var(--maroon);border-radius:2.6mm;background:rgba(102,0,0,.04);
}
.stage .orbox__or{font-family:BarlowC;font-weight:700;font-style:italic;font-size:26pt;color:var(--maroon);line-height:.9}
.stage .orbox__t{font-family:Aleo;font-weight:700;font-size:8pt;color:var(--maroon);line-height:1.25}
.stage .orbox__a{font-family:Tajawal;font-weight:700;font-size:8pt;color:var(--maroon);direction:rtl;line-height:1.4}
.stage .crd{
  position:relative;z-index:3;
  background:rgba(255,255,255,.86);border-radius:var(--radius);overflow:hidden;
  border:.25mm solid rgba(0,0,0,.09);
  box-shadow:0 .35mm 1mm rgba(0,0,0,.07);
  display:flex;flex-direction:column;
}
.stage .crd__top{
  background:var(--cat);display:flex;align-items:center;justify-content:space-between;
  padding:1.5mm 2.8mm;gap:2mm;
}
.stage .crd__code{
  font-family:DMSans;font-weight:700;font-size:10.5pt;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:.045em;line-height:1;
}
.stage .crd__cr{
  font-family:DMSans;font-weight:700;font-size:6.2pt;color:#fff;
  background:rgba(255,255,255,.26);border-radius:9mm;padding:.7mm 1.9mm;
  letter-spacing:.06em;line-height:1;white-space:nowrap;
}
.stage .crd__first{
  background:rgba(0,0,0,.14);color:#fff;
  font-family:DMSans;font-weight:700;font-size:5.9pt;letter-spacing:.1em;
  text-transform:uppercase;padding:.9mm 2.8mm;display:flex;justify-content:space-between;gap:2mm;
}
.stage .crd__first .ar{font-family:Tajawal;font-weight:700;letter-spacing:0;font-size:6.6pt}
.stage .crd__body{padding:2.4mm 2.8mm 2.8mm;flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.55)}
.stage .crd__en{font-family:Aleo;font-weight:700;font-size:8.6pt;line-height:1.26;color:var(--ink)}
.stage .crd__ar{
  font-family:Tajawal;font-weight:500;font-size:8.6pt;line-height:1.5;
  direction:rtl;text-align:right;color:#4A4241;margin-top:1mm;
}
.stage .crd__note{
  margin-top:1.6mm;font-family:DMSans;font-size:5.9pt;line-height:1.3;
  color:var(--ink-faint);font-style:italic;
}
.stage .crd__fix{
  margin-top:1.6mm;font-family:DMSans;font-weight:500;font-size:6pt;line-height:1.3;
  color:#8A4A00;background:#FFF6E8;border-radius:1mm;padding:1.1mm 1.6mm;
}
.stage .crd--wide .crd__names{display:flex;align-items:flex-start;gap:9mm}
.stage .crd--wide .crd__names>*{flex:1 1 0;min-width:0;margin:0}
.stage .crd--capstone{box-shadow:0 0 0 .7mm rgba(102,0,0,.3),0 .4mm 1.4mm rgba(0,0,0,.1)}
.stage .cat-core{--cat:var(--c-core)}
.stage .cat-analytics{--cat:var(--c-analytics)}
.stage .cat-appdev{--cat:var(--c-appdev)}
.stage .cat-elective{--cat:var(--c-elective)}
.stage .cat-support{--cat:var(--c-support)}
.stage .cat-technical{--cat:var(--c-support)}
.stage .cat-lang{--cat:var(--c-lang)}
.stage .cat-math{--cat:var(--c-math)}
.stage .cat-acct{--cat:var(--c-acct)}
.stage .cat-econ{--cat:var(--c-econ)}
.stage .cat-biz{--cat:var(--c-biz)}
.stage .crd__need{
  margin-top:1.8mm;display:inline-flex;align-self:flex-start;gap:2mm;align-items:baseline;
  background:rgba(0,0,0,.05);border-radius:9mm;padding:.9mm 2.4mm;
}
.stage .crd__need b{font-family:DMSans;font-weight:700;font-size:6.2pt;color:#5C5250;letter-spacing:.02em}
.stage .crd__need span{font-family:Tajawal;font-weight:500;font-size:6.6pt;color:#5C5250;direction:rtl}
.stage .ladder-note{
  grid-column:1/-1;z-index:2;
  font-family:DMSans;font-size:6.4pt;color:var(--ink-soft);line-height:1.4;
  display:flex;justify-content:space-between;gap:8mm;padding:0 1mm;
}
.stage .ladder-note span:last-child{font-family:Tajawal;font-size:6.6pt;direction:rtl}
.stage .wires{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible}
.stage .wires > path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.stage .wire--hard{stroke:var(--wire-hard);stroke-width:.45mm;opacity:.8}
.stage .wire--soft{stroke:var(--wire);stroke-width:.4mm;stroke-dasharray:1.6mm 1.3mm;opacity:.7}
.stage .wires circle{fill:var(--wire-hard);opacity:.8}
.stage .ft{
  position:relative;z-index:2;display:flex;align-items:center;gap:5.5mm;
  margin-top:3.2mm;padding-top:2.8mm;border-top:.25mm solid var(--rule);
}
.stage .ft__scan{
  flex:none;display:flex;align-items:center;gap:4mm;text-decoration:none;color:inherit;
  padding-right:6mm;border-right:.25mm solid var(--rule);
}
.stage .ft__qr{
  width:28mm;height:28mm;display:block;flex:none;border-radius:2.2mm;
  border:.6mm solid var(--maroon);padding:1mm;background:#fff;
}
.stage .ft__scanT{display:flex;flex-direction:column;width:58mm}
.stage .ft__scanH{font-family:BarlowC;font-weight:700;font-style:italic;font-size:12pt;
  line-height:1.05;color:var(--maroon);letter-spacing:.01em}
.stage .ft__scanA{font-family:Cairo;font-weight:700;font-size:10pt;line-height:1.6;
  color:var(--maroon);direction:rtl;text-align:left}
.stage .ft__scanL{font-family:DMSans;font-size:6.2pt;line-height:1.35;color:var(--ink-soft);margin-top:.6mm}
.stage .ft__scanL b{display:block;font-family:Tajawal;font-weight:400;font-size:6.4pt;
  line-height:1.5;direction:rtl;text-align:right;margin-top:.3mm}
.stage .ft__scanU{margin-top:1.2mm;font-family:DMSans;font-weight:700;font-size:7.2pt;
  letter-spacing:.02em;color:var(--maroon)}
.stage .ft__txt{width:46mm;flex:none;font-family:DMSans;font-size:6.6pt;color:var(--ink-soft);line-height:1.5}
.stage .ft__txt b{color:var(--ink);font-weight:700}
.stage .ft__changed{flex:1;min-width:0}
.stage .ft__changed h4{font-family:Aleo;font-weight:700;font-size:8pt;color:#8A4A00;margin:0 0 1.4mm}
.stage .ft__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm}
.stage .ft__item{
  font-family:Aleo;font-size:6.8pt;line-height:1.34;color:var(--ink);
  padding-left:3mm;border-left:.7mm solid #E8C98F;
}
.stage .ft__item .ar{display:block;font-family:Tajawal;font-size:6.8pt;color:var(--ink-soft);direction:rtl;text-align:right;line-height:1.5;margin-top:.4mm}
.stage .ft__page{font-family:BarlowC;font-weight:700;font-style:italic;font-size:20pt;color:var(--maroon);opacity:.4;line-height:1}
.stage .grid--11{grid-template-columns:26mm repeat(10,1fr)}
.stage .grid--11 .stripe{grid-column:1/12}
.stage .grid--13{grid-template-columns:26mm repeat(12,1fr)}
.stage .grid--13 .stripe{grid-column:1/14}
.stage .startbox,.stage .gatebox{
  z-index:3;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2.2mm;
  padding:5mm 7mm;border-radius:2.6mm;
  border:.7mm dashed var(--maroon);background:rgba(102,0,0,.05);
}
.stage .startbox__h,.stage .gatebox__h{display:flex;align-items:baseline;gap:3mm}
.stage .startbox__chip,.stage .gatebox__chip{
  font-family:DMSans;font-weight:700;font-size:6.4pt;color:#fff;background:var(--maroon);
  padding:1mm 2.8mm;border-radius:9mm;letter-spacing:.09em;flex:none;
}
.stage .startbox__codes,.stage .gatebox__codes{font-family:DMSans;font-weight:700;font-size:13pt;color:var(--maroon);letter-spacing:.03em}
.stage .startbox__en,.stage .gatebox__en{font-family:Aleo;font-weight:700;font-size:9.4pt;line-height:1.3;color:var(--ink)}
.stage .startbox__ar,.stage .gatebox__ar{font-family:Tajawal;font-weight:500;font-size:9.4pt;line-height:1.55;color:#554C4A;direction:rtl;text-align:right}
.stage .subgrid{display:grid;gap:var(--gap);z-index:3}
.stage .subgrid--4{grid-template-columns:repeat(4,1fr)}
.stage .tipbox{font-family:Aleo;font-size:7.8pt;line-height:1.34;color:var(--ink)}
.stage .tipbox .ar{display:block;font-family:Tajawal;font-size:7.8pt;color:#554C4A;direction:rtl;text-align:right;margin-top:.8mm;line-height:1.5}
.stage .tipbox b{color:var(--maroon)}
.stage .grid--roomy{grid-auto-rows:minmax(40mm,auto);align-content:space-between}
.stage .grid--roomy .crd__body{justify-content:center}
.stage .grid--roomy .subgrid{align-self:center}
.stage .nextstep{
  position:relative;z-index:3;display:flex;align-items:center;gap:5mm;
  margin-top:3.2mm;padding:3.6mm 5mm;border-radius:2.4mm;
  background:rgba(102,0,0,.07);border-left:1.4mm solid var(--maroon);
}
.stage .nextstep__n{
  font-family:DMSans;font-weight:700;font-size:6.4pt;color:#fff;background:var(--maroon);
  padding:1mm 2.8mm;border-radius:9mm;letter-spacing:.09em;flex:none;
}
.stage .nextstep__en{font-family:Aleo;font-weight:700;font-size:8.4pt;line-height:1.35;color:var(--ink);flex:1}
.stage .nextstep__ar{font-family:Tajawal;font-weight:500;font-size:8.4pt;line-height:1.5;color:#554C4A;direction:rtl;text-align:right;flex:1}
.stage .grid--snug{grid-auto-rows:minmax(40mm,auto);align-content:space-between}
.stage .grid--snug .crd__body{justify-content:center}
.stage .canvas--stack{display:flex;flex-direction:column;min-height:0}
.stage .canvas--stack > .grid{height:auto;flex:1;min-height:0;row-gap:4.1mm}
.stage .stag{
  z-index:3;display:flex;flex-direction:column;gap:.5mm;justify-content:flex-end;
  padding:0 1.4mm 1.6mm;border-bottom:.9mm solid var(--cat);
}
.stage .stag__en{font-family:Aleo;font-weight:700;font-size:8.4pt;line-height:1.12;color:var(--cat)}
.stage .stag__ar{font-family:Cairo;font-weight:700;font-size:8pt;line-height:1.15;color:var(--cat);direction:rtl;opacity:.9}
.stage .cell{display:grid;gap:var(--gap);z-index:3}
.stage .cell--1{grid-template-columns:1fr}
.stage .cell--2{grid-template-columns:repeat(2,1fr)}
.stage .needs{margin-top:2mm;display:flex;flex-wrap:wrap;gap:1.2mm}
.stage .need{
  display:inline-flex;align-items:center;gap:1.4mm;
  background:rgba(0,0,0,.05);border-radius:9mm;padding:.8mm 2.2mm .8mm 1.4mm;
}
.stage .need__sw{width:2.5mm;height:2.5mm;border-radius:.6mm;background:var(--nc);flex:none}
.stage .need__c{
  font-family:DMSans;font-weight:700;font-size:6.4pt;color:#3F3836;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1;
}
.stage .key__tag{
  display:inline-flex;align-items:center;gap:1.2mm;background:rgba(0,0,0,.05);
  border-radius:9mm;padding:.7mm 1.8mm .7mm 1.2mm;flex:none;
}
.stage .key__tag i{width:2.2mm;height:2.2mm;border-radius:.5mm;background:var(--c-econ);display:block}
.stage .key__tag b{font-family:DMSans;font-weight:700;font-size:5.8pt;color:#3F3836}
.stage .levelnote{
  z-index:3;align-self:center;display:flex;flex-direction:column;gap:1.4mm;
  padding:4mm 5mm;border-left:.8mm solid var(--rule);
}
.stage .levelnote__en{font-family:Aleo;font-size:7.8pt;line-height:1.35;color:var(--ink-soft)}
.stage .levelnote__ar{font-family:Tajawal;font-size:7.8pt;line-height:1.55;color:var(--ink-soft);direction:rtl;text-align:right}
.stage .band__tag{
  margin-top:1.6mm;font-family:DMSans;font-weight:700;font-size:4.9pt;
  letter-spacing:.07em;color:var(--band-ink);line-height:1.35;text-align:center;opacity:.95;
}
.stage .band__tag span{display:block;font-family:Tajawal;font-weight:700;letter-spacing:0;font-size:5.6pt}
.stage .crd--gate{background:rgba(255,255,255,.62);border:.45mm dashed rgba(0,0,0,.28);box-shadow:none}
.stage .crd--gate .crd__top{opacity:.88}
.stage .crd__from{
  margin-top:2mm;display:flex;align-items:center;gap:2.2mm;
  padding-top:1.8mm;border-top:.25mm solid var(--rule);
}
.stage .crd__from img{height:5.4mm;width:auto;display:block;flex:none}
.stage .crd__from span{font-family:DMSans;font-weight:500;font-size:5.9pt;line-height:1.3;color:var(--ink-soft)}
.stage .crd__from span b{display:block;font-family:Tajawal;font-weight:500;font-size:6.2pt;direction:rtl;text-align:right}
.stage .band--gate{--tint-strong:#CFC7C5;--band-ink:#3F3836}
.stage .band__mark{width:15mm;height:auto;display:block;margin:1.6mm 0 1.2mm}
.stage .gatelead{
  z-index:3;align-self:center;display:flex;flex-direction:column;gap:1.4mm;
  padding:3.4mm 5mm;border-left:.8mm solid var(--rule);
}
.stage .gatelead__h{font-family:Aleo;font-weight:700;font-size:8.6pt;color:var(--ink);line-height:1.25}
.stage .gatelead__ha{font-family:Cairo;font-weight:700;font-size:8.2pt;color:var(--ink);direction:rtl;text-align:right;line-height:1.3}
.stage .gatelead__en{font-family:Aleo;font-size:7.4pt;line-height:1.35;color:var(--ink-soft)}
.stage .gatelead__ar{font-family:Tajawal;font-size:7.4pt;line-height:1.55;color:var(--ink-soft);direction:rtl;text-align:right}
.stage .crd__opens{
  margin-top:2mm;display:flex;align-items:center;gap:2mm;
  padding:1.4mm 1.6mm;border-radius:1.2mm;gap:1.6mm;
  background:rgba(102,0,0,.075);border-left:.7mm solid var(--maroon);
}
.stage .crd__opens img{height:4.2mm;width:auto;display:block;flex:none}
.stage .crd__opens span{font-family:DMSans;font-weight:700;font-size:5.8pt;line-height:1.25;color:var(--maroon);min-width:0}
.stage .crd__opens span b{
  display:block;font-family:Tajawal;font-weight:500;font-size:6pt;line-height:1.4;
  direction:rtl;text-align:right;color:#6B3A3A;
}
.stage .crd__flag{
  margin-top:1.6mm;padding:1.1mm 1.5mm;border-radius:1.2mm;
  background:#FBF4E3;border-left:.7mm solid #C9A227;
  font-family:DMSans;font-weight:500;font-size:5.7pt;line-height:1.28;color:#6B5A2A;
}
.stage .crd__flag b{
  display:block;font-family:Tajawal;font-weight:500;font-size:6pt;line-height:1.45;
  direction:rtl;text-align:right;margin-top:.4mm;color:#6B5A2A;
}
.stage .crd--el .crd__body{padding:1.9mm 2.6mm 2.1mm}
.stage .crd__arname{font-family:Tajawal;font-weight:700;font-size:8.8pt;line-height:1.36;
  direction:rtl;text-align:right;color:var(--ink)}
.stage .crd__tr{margin-top:1.2mm;font-family:Aleo;font-style:italic;font-size:7pt;line-height:1.24;color:#7D7270}
.stage .crd--dead{opacity:.62}
.stage .crd--dead .crd__top{background:repeating-linear-gradient(135deg,var(--cat) 0 2.2mm,rgba(0,0,0,.22) 2.2mm 4.4mm)}
.stage .crd__warn{font-family:DMSans;font-weight:700;font-size:6.2pt;color:#fff;
  background:rgba(0,0,0,.3);border-radius:9mm;padding:.7mm 2mm;letter-spacing:.06em}
.stage .gwrap{display:flex;flex-direction:column;gap:2mm;z-index:3;min-width:0}
.stage .gtag{display:flex;align-items:baseline;gap:3mm;padding:0 1mm .4mm}
.stage .gtag>span:nth-child(2){flex:1;min-width:0}
.stage .gtag__n{font-family:DMSans;font-weight:700;font-size:6pt;color:#fff;background:var(--cat);
  padding:.9mm 2.4mm;border-radius:9mm;letter-spacing:.09em;flex:none}
.stage .gtag__en{font-family:Aleo;font-weight:700;font-size:9.6pt;line-height:1.1;color:var(--cat)}
.stage .gtag__ar{font-family:Cairo;font-weight:700;font-size:9.2pt;direction:rtl;line-height:1.15;color:var(--cat)}
.stage .gtag__sub{display:block;font-family:DMSans;font-weight:500;font-size:6.4pt;color:var(--ink-soft);letter-spacing:.02em}
.stage .freebox{
  z-index:3;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2.4mm;
  padding:3.6mm 6mm;border-radius:2.6mm;border:.7mm dashed var(--c-support);background:rgba(85,99,43,.06);
}
.stage .freebox__en{font-family:Aleo;font-weight:700;font-size:9.4pt;line-height:1.35;color:var(--ink)}
.stage .freebox__ar{font-family:Tajawal;font-weight:500;font-size:9.4pt;line-height:1.55;color:#554C4A;direction:rtl;text-align:right}
.stage .gtag__count{
  flex:none;text-align:right;font-family:DMSans;font-weight:700;font-size:6.6pt;
  letter-spacing:.08em;color:var(--cat);line-height:1.25;
}
.stage .gtag__count b{display:block;font-family:Tajawal;font-weight:700;font-size:7.4pt;
  letter-spacing:0;direction:rtl;opacity:.8}
.stage .tcols{display:grid;grid-template-columns:1fr 1fr;gap:6mm;flex:1;min-height:0}
.stage .tcol{
  position:relative;z-index:3;display:flex;flex-direction:column;min-height:0;
  border-radius:2.6mm;overflow:hidden;padding-bottom:5.5mm;
  background:rgba(255,255,255,.74);border:.25mm solid var(--rule);
  box-shadow:0 .4mm 1.6mm rgba(0,0,0,.06);
}
.stage .tcol__h{background:var(--tc);color:#fff;padding:4.4mm 6mm 4.6mm;display:flex;flex-direction:column;gap:1.2mm}
.stage .tcol__tag{font-family:DMSans;font-weight:700;font-size:6.2pt;letter-spacing:.16em;opacity:.78;line-height:1}
.stage .tcol__en{font-family:BarlowC;font-weight:700;font-style:italic;font-size:26pt;line-height:1.14;letter-spacing:.005em}
.stage .tcol__ar{font-family:Cairo;font-weight:700;font-size:16pt;line-height:1.78;direction:rtl;text-align:left}
.stage .tcol__sub{padding:3.2mm 6mm 0;display:flex;flex-direction:column;gap:.8mm}
.stage .tcol__sub-en{font-family:Aleo;font-size:9.4pt;line-height:1.35;color:var(--ink-soft)}
.stage .tcol__sub-ar{font-family:Tajawal;font-size:9.4pt;line-height:1.55;color:var(--ink-soft);direction:rtl;text-align:right}
.stage .tlist{list-style:none;margin:0;padding:4.5mm 6mm 0;display:flex;flex:1;flex-direction:column;justify-content:space-evenly;gap:5mm}
.stage .trow{display:flex;gap:4mm;align-items:flex-start}
.stage .tchip{
  flex:none;min-width:31mm;text-align:center;padding:2.4mm 2.8mm;border-radius:1.8mm;
  background:var(--tc);color:#fff;font-family:DMSans;font-weight:700;font-size:15pt;
  line-height:1;font-variant-numeric:tabular-nums;
}
.stage .tchip--code{font-size:12.5pt;letter-spacing:.02em}
.stage .tchip--word{font-size:10.5pt;letter-spacing:.12em;padding:3.3mm 2.8mm}
.stage .trow__t{min-width:0;flex:1;display:flex;flex-direction:column;gap:.7mm}
.stage .trow__en{font-family:Aleo;font-weight:700;font-size:10pt;line-height:1.3;color:var(--ink)}
.stage .trow__ar{font-family:Tajawal;font-size:10pt;line-height:1.55;color:#554C4A;direction:rtl;text-align:right}
.stage .tgpa{padding:5mm 6mm 0;display:flex;flex-direction:column;gap:1.6mm}
.stage .tgpa__en{font-family:Aleo;font-weight:700;font-size:10pt;line-height:1.3;color:var(--ink)}
.stage .tgpa__ar{font-family:Tajawal;font-size:10pt;line-height:1.55;color:#554C4A;direction:rtl;text-align:right;margin-bottom:.8mm}
.stage .tier{display:flex;align-items:center;gap:4mm;border-radius:1.8mm;padding:3.8mm 3.6mm;background:var(--tint)}
.stage .tier__g{
  flex:none;width:26mm;display:flex;flex-direction:column;align-items:center;
  font-family:DMSans;font-weight:700;font-size:20pt;color:var(--maroon);line-height:1;
  font-variant-numeric:tabular-nums;
}
.stage .tier__g span{font-family:DMSans;font-weight:700;font-size:6pt;letter-spacing:.11em;color:#8C6B6B;margin-top:1.2mm}
.stage .tier__m{flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,1fr);gap:2.2mm 4mm}
.stage .maj{display:flex;align-items:center;gap:2.2mm;min-width:0}
.stage .maj__c{
  flex:none;font-family:DMSans;font-weight:700;font-size:8.6pt;color:#fff;background:#9C7B7B;
  border-radius:9mm;padding:1mm 2.4mm;line-height:1;font-variant-numeric:tabular-nums;
}
.stage .maj--ours .maj__c{background:var(--maroon)}
.stage .maj__t{min-width:0;flex:1}
.stage .maj__en{display:block;font-family:Aleo;font-weight:700;font-size:8.8pt;line-height:1.18;color:var(--ink)}
.stage .maj__ar{display:block;font-family:Tajawal;font-size:8.8pt;line-height:1.4;color:#554C4A;direction:rtl;text-align:right}
.stage .tpick{padding:5mm 6mm 0;display:flex;flex-direction:column;gap:3mm}
.stage .tpick__cards .crd{min-height:40mm}
.stage .tpick__cards{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.stage .crd__fix b{
  display:block;font-family:Tajawal;font-weight:500;font-size:6.2pt;line-height:1.45;
  direction:rtl;text-align:right;margin-top:.4mm;color:#8A4A00;
}
.stage .tend{
  margin:4mm 6mm 0;padding:3.6mm 4.4mm;border-radius:1.8mm;display:flex;flex-direction:column;gap:.8mm;
  background:rgba(102,0,0,.07);border-left:1.2mm solid var(--maroon);
}
.stage .tend__en{font-family:Aleo;font-weight:700;font-size:9.4pt;line-height:1.3;color:var(--ink)}
.stage .tend__ar{font-family:Tajawal;font-size:9.4pt;line-height:1.5;color:#554C4A;direction:rtl;text-align:right}
.stage .mine{display:flex;flex-direction:column;gap:2.4mm}
.stage .mine__row{display:flex;align-items:center;gap:2.8mm}
.stage .mine__row img{height:13mm;width:auto;display:block;flex:none}
.stage .mine__c{

<style>
/* ===== the app around the sheet ===== */

/* no point showing a code for the site you are already standing on */
.stage .ft__scan{display:none}

/* ticking a course, right on the map */
.stage .crd[data-code]{cursor:pointer;transition:box-shadow .12s,transform .08s}

.stage .crd[data-code]::after{

div class=\"crd__en\">Special Topics in Information Systems</div><div class=\"crd__ar\">مواضيع خاصة في نظم المعلومات</div></div>\n      \n    </div>\n  </div>\n        \n  <div class=\"crd cat-support crd--wide\" data-code=\"1013316\" style=\"grid-row:10;grid-column:2/6\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1013316</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Logistics &amp; Supply Chain Management</div><div class=\"crd__ar\">إدارة سلسلة الإمدادات والخدمات اللوجستية</div></div>\n      \n    </div>\n  </div>\n  <div class=\"crd cat-support crd--wide\" data-code=\"1011430\" style=\"grid-row:10;grid-column:6/10\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1011430</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Internet Marketing</div><div class=\"crd__ar\">التسويق عبر الإنترنت</div></div>\n      \n    </div>\n  </div>\n\n        <svg class=\"wires\" id=\"wires\"></svg>\n      </div>\n      <div class=\"ladder-note\" style=\"margin-top:1.8mm\">\n        <span>Kuwait University’s plan puts these courses in semesters 2 to 8. They are shown here as levels, in that same order.</span><span>خطة الجامعة تضع هذه المقررات في الفصول من ٢ إلى ٨، وهي معروضة هنا كمستويات بالترتيب نفسه.</span>\n      </div>\n    </div>\n  </div>\n\n  \n  <footer class=\"ft\">\n    <a class=\"ft__scan\" href=\"https://isom-graduate.vercel.app\">\n      <img class=\"ft__qr\" src=\"@@qr.png\" alt=\"isom-graduate.vercel.app\">\n      <span class=\"ft__scanT\">\n        <span class=\"ft__scanH\">WHEN DO I GRADUATE</span>\n        <span class=\"ft__scanA\">متى أتخرج؟</span>\n        <span class=\"ft__scanL\">Scan it. Tick the courses you have passed on this very map, and it tells you what is left and the term you finish.<b>امسح الرمز. أشّر على المقررات التي اجتزتها على هذه الخريطة نفسها،  class=\"panel__h-ar\">ما الذي يجب عليك دراسته</div>\n    <ol class=\"steps\">\n      <li>Take every red course. You cannot skip one.<span class=\"ar\">جميع المقررات الحمراء إجبارية، لا يمكن تخطي أي منها.</span></li><li>Pick 3 purple courses — 9 credits.<span class=\"ar\">اختر ٣ مقررات بنفسجية — ٩ وحدات.</span></li><li>Pick 2 green courses — 6 credits.<span class=\"ar\">اختر مقررين أخضرين — ٦ وحدات.</span></li><li>Finish your major with the project.<span class=\"ar\">أنهِ تخصصك بمشروع التخرج.</span></li><li>Some courses need another course first. The card tells you.<span class=\"ar\">بعض المقررات تتطلب مقرراً سابقاً، والبطاقة توضح ذلك.</span></li>\n    </ol>\n  </div>\n  <div class=\"panel panel--accent\">\n    <div class=\"panel__h\">What the colours mean</div>\n    <div class=\"panel__h-ar\">معنى الألوان</div>\n    <div class=\"key\">\n      \n      <div class=\"key__row\">\n        <span class=\"key__chip\" style=\"background:var(--c-core)\">ALL</span>\n        <span class=\"key__txt\"><span class=\"key__en\">Red — you must take every one</span><span class=\"key__ar\">الأحمر — جميعها إجبارية</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__chip\" style=\"background:var(--c-elective)\">PICK 3</span>\n        <span class=\"key__txt\"><span class=\"key__en\">Yellow — pick 3 of these eight</span><span class=\"key__ar\">الأصفر — اختر ٣ من الثمانية</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__chip\" style=\"background:var(--c-support)\">PICK 2</span>\n        <span class=\"key__txt\"><span class=\"key__en\">Green — pick 2 of these five</span><span class=\"key__ar\">الأخضر — اختر مقررين من الخمسة</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__wire\"></span>\n        <span class=\"key__txt\"><span class=\"key__en\">A line means: finish the course it comes from first</span><span class=\"key__ar\">الخط يعني: أنهِ المقرر الذي يبدأ منه أولاً</span></span>\n      </div>\n    </div>\n  </div>\n  <div class=\"panel panel--accent\">\n    <div class=\"panel__h\">Your whole degree</div>\n    <div class=\"panel__h-ar\">درجتك كاملة</div>\n    <div class=\"shape\">\n      \n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#D8C9C9\"></span>\n        <span class=\"shape__n\">61</span>\n        <span><span class=\"shape__t\">General courses</span><span class=\"shape__a\">المقررات العامة</span></span>\n      </div>\n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#A97B7B\"></span>\n        <span class=\"shape__n\">36</span>\n        <span><span class=\"shape__t\">College courses</span><span class=\"shape__a\">مقررات الكلية</span></span>\n      </div>\n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#660000\"></span>\n        <span class=\"shape__n\">27</span>\n        <span><span class=\"shape__t\">Your major</span><span class=\"shape__a\">مقررات التخصص</span></span>\n      </div>\n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#55632B\"></span>\n        <span class=\"shape__n\">6</span>\n        <span><span class=\"shape__t\">Supporting</span><span class=\"shape__a\">المقررات المساندة</span></span>\n      </div>\n    </div>\n    <div class=\"shape__tot\"><span><b>130</b> credits to graduate</span><span style=\"font-family:Tajawal;direction:rtl\"><b>١٣٠</b> وحدة للتخرج</span></div>\n  </div></aside>\n    <div class=\"canvas canvas--stack\">\n      <div class=\"grid grid--11 grid--roomy\" id=\"grid\">\n        \n  <div class=\"stripe\" style=\"grid-row:1;--tint:rgba(0,0,0,.035)\"></div>\n  <div class=\"band band--gate\" style=\"grid-row:1\">\n    <span class=\"band__l\">Before</span><img class=\"band__mark\" src=\"@@isom-logo.png\" alt=\"ISOM Club\"><span class=\"band__ar\">قبل البداية</span></div>\n  \n  <div class=\"crd cat-math crd--wide crd--gate\" data-code=\"1013110\" style=\"grid-row:1;grid-column:3/6\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1013110</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Mathematics for Business</div><div class=\"crd__ar\">الرياضيات للعلوم التجارية</div></div>\n      <div class=\"crd__from\"><img src=\"@@isom-logo.png\" alt=\"ISOM Club\"><span>General Courses page &nbsp;·&nbsp; 03<b>صفحة المقررات العامة</b></span></div>\n    </div>\n  </div>\n  <div class=\"crd cat-biz crd--wide crd--gate\" data-code=\"1011201\" style=\"grid-row:1;grid-column:8/11\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1011201</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Principles of Management</div><div class=\"crd__ar\">مبادئ الإدارة</div></div>\n      <div class=\"crd__from\"><img src=\"@@isom-logo.png\" alt=\"ISOM Club\"><span>General Courses page &nbsp;·&nbsp; 03<b>صفحة المقررات العامة</b></span></div>\n    </div>\n  </div>\n  <div class=\"gatelead\" style=\"grid-row:1;grid-column:6/8\">\n    <span class=\"gatelead__h\">Before you can start this major</span><span class=\"gatelead__ha\">قبل أن تبدأ هذا التخصص</span>\n    <span class=\"gatelead__en\">These two are on the General Courses page. Each one opens the red course directly below it.</span><span class=\"gatelead__ar\">هذان المقرران في صفحة المقررات العامة، وكل منهما يفتح المقرر الأحمر الذي تحته مباشرة.</span>\n  </div>\n        <div class=\"stripe\" style=\"grid-row:2;--tint:rgba(102,0,0,.075)\"></div><div class=\"stripe\" style=\"grid-row:3;--tint:rgba(102,0,0,.125)\"></div><div class=\"stripe\" style=\"grid-row:4;--tint:rgba(102,0,0,.175)\"></div>\n        <div class=\"band\" style=\"grid-row:2;--tint-strong:#E0C4C4;--band-ink:#4A0000\">\n            <span class=\"band__l\">Level</span><span class=\"band__n\">1</span><span class=\"band__ar\">المستوى</spa n><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Business Analytics for Managers</div><div class=\"crd__ar\">تحليل الأعمال لاتخاذ القرارات</div></div>\n      <div class=\"crd__note\">Portal title: Business Analytics for Decision Making</div>\n    </div>\n  </div>\n  <div class=\"crd cat-technical\" data-code=\"1011310\" style=\"\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1011310</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Entrepreneurship</div><div class=\"crd__ar\">ريادة الأعمال وإدارة المشروعات الصغيرة</div></div>\n      \n    </div>\n  </div>\n  <div class=\"crd cat-technical\" data-code=\"1011322\" style=\"\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1011322</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Consumer Behavior</div><div class=\"crd__ar\">سلوك المستهلك</div></div>\n      \n    </div>\n  </div>\n  <div class=\"crd cat-technical\" data-code=\"1020416\" style=\"\">\n    <div class=\"crd__top\"><span class=\"crd__code\">1020416</span><span class=\"crd__cr\">3 CR</span></div>\n    \n    <div class=\"crd__body\">\n      <div class=\"crd__names\"><div class=\"crd__en\">Cost &amp; Managerial Accounting</div><div class=\"crd__ar\">التكاليف والمحاسبة الإدارية</div></div>\n      \n    </div>\n  </div></div>\n        <svg class=\"wires\" id=\"wires\"></svg>\n      </div>\n      <div class=\"ladder-note\" style=\"margin-top:1.8mm\">\n        <span>Kuwait University’s plan for this major does not print semester numbers, so these are levels in prerequisite order.</span><span>خطة الجامعة لهذا التخصص لا تتضمن أرقام الفصول، لذلك رُتبت هنا كمستويات حسب المتطلبات السابقة.</span>\n      </div>\n    </div>\n  </div>\n  \n  <footer class=\"ft\">\n    <a class=\"ft__scan\" href=\"https://isom-graduate.vercel.app\">\n      <img class=\"ft__qr\" src=\"@@qr.png\" alt=\"isom-graduate.vercel.app\">\n      <span class=\"ft__scanT\">\n        <span class=\"ft__scanH\">WHEN DO I GRADUATE</span>\n        <span class=\"ft__scanA\">متى أتخرج؟</span>\n        <span class=\"ft__scanL\">Scan it. Tick the courses you have passed on this very map, and it tells you what is left and the term you finish.<b>امسح الرمز. أشّر على المقررات التي اجتزتها على هذه الخريطة نفسها، فيخبرك بما بقي وبالفصل الذي تتخرج فيه.</b></span>\n        <span class=\"ft__scanU\">isom-graduate.vercel.app</span>\n      </span>\n    </a>\n    <div class=\"ft__txt\"><b>ISOM Club</b> · Kuwait University<br>College of Business Administration<br>\n      <span style=\"color:var(--ink-faint)\">Checked against the CBA major plan and the KU registration system, September 2026.</span></div>\n    <div class=\"ft__changed\">\n      <h4>Good to know &nbsp;·&nbsp; <span style=\"font-family:Tajawal;direction:rtl;unicode-bidi:isolate\">معلومات مهمة</span></h4>\n      <div class=\"ft__grid\"><div class=\"ft__item\">Every number on this sheet is the number you type into the registration system.<span class=\"ar\">كل رقم في هذه الورقة هو الرقم الذي تُدخله في نظام التسجيل.</span></div><div class=\"ft__item\">You need 9 credits of purple electives and 6 credits of green ones. That is 5 courses in total.<span class=\"ar\">تحتاج ٩ وحدات من المقررات البنفسجية و ٦ وحدات من الخضراء، أي ٥ مقررات في المجموع.</span></div><div class=\"ft__item\">Prerequisites here come from the registration system — they are what actually lets you register.<span class=\"ar\">المتطلبات السابقة هنا مأخوذة من نظام التسجيل، وهي ما يسمح لك بالتسجيل فعلياً.</span></div><div class=\"ft__item\">Always check your own plan in the portal before you register each semester.<span class=\"ar\">راجع خطتك الدراسية في النظام قبل التسجيل في كل فصل.</span></div></div>\n    </div>\n    <div class=\"ft__page\">02</div>\n  </footer>\n</section>","w an></div>\n    <div class=\"ft__changed\">\n      <h4>Good to know &nbsp;·&nbsp; <span style=\"font-family:Tajawal;direction:rtl;unicode-bidi:isolate\">معلومات مهمة</span></h4>\n      <div class=\"ft__grid\"><div class=\"ft__item\">Every number on this sheet is the number you type into the registration system.<span class=\"ar\">كل رقم في هذه الورقة هو الرقم الذي تُدخله في نظام التسجيل.</span></div><div class=\"ft__item\">Prerequisites here come from the registration system — they are what actually lets you register.<span class=\"ar\">المتطلبات السابقة هنا مأخوذة من نظام التسجيل، وهي ما يسمح لك بالتسجيل فعلياً.</span></div><div class=\"ft__item\">The registration system does not publish credit hours. Standard courses are 3 credits; the three placement courses depend on your placement result.<span class=\"ar\">نظام التسجيل لا ينشر عدد الوحدات. المقررات الاعتيادية ٣ وحدات، أما مقررات تحديد المستوى الثلاثة فتعتمد على نتيجة اختبارك.</span></div><div class=\"ft__item\">Always check your own plan in the portal before you register each semester.<span class=\"ar\">راجع خطتك الدراسية في النظام قبل التسجيل في كل فصل.</span></div></div>\n    </div>\n    <div class=\"ft__page\">03</div>\n  </footer>\n</section>","wires":"[{\"s\":\"9988096\",\"t\":\"9988106\",\"k\":\"wire--hard\",\"cat\":\"lang\"},{\"s\":\"9988106\",\"t\":\"9988126\",\"k\":\"wire--hard\",\"cat\":\"lang\"},{\"s\":\"0410091\",\"t\":\"1013130\",\"k\":\"wire--hard\",\"cat\":\"math\"},{\"s\":\"9988106\",\"t\":\"1013130\",\"k\":\"wire--hard\",\"cat\":\"lang\"},{\"s\":\"0410091\",\"t\":\"1013110\",\"k\":\"wire--hard\",\"cat\":\"math\"},{\"s\":\"9988106\",\"t\":\"1013110\",\"k\":\"wire--hard\",\"cat\":\"lang\"},{\"s\":\"0410091\",\"t\":\"1020111\",\"k\":\"wire--hard\",\"cat\":\"math\"},{\"s\":\"9988106\",\"t\":\"1020111\",\"k\":\"wire--hard\",\"cat\":\"lang\"},{\"s\":\"0410091\",\"t\":\"1011201\",\"k\":\"wire--hard\",\"cat\":\"math\"},{\"s\":\"9988106\",\"t\":\"1011201\",\"k\":\"wire--hard\",\"cat\":\"lang\"},{\"s\":\"04 v>\n  \n  <header class=\"hd\">\n    <img class=\"hd__club\" src=\"@@isom-logo.png\" alt=\"ISOM Club\">\n    <div class=\"hd__titles\">\n      <h1 class=\"hd__en\">Elective Courses</h1>\n      <div class=\"hd__ar\">المقررات الاختيارية</div>\n      <div class=\"hd__meta\">Your course map · 2026 / 2027 · خريطة مقرراتك</div>\n    </div>\n    <img class=\"hd__crest\" src=\"@@ku-logo.png\" alt=\"Kuwait University\">\n  </header>\n  <div class=\"body\">\n    <aside class=\"rail\">\n  <div class=\"panel panel--accent\">\n    <div class=\"panel__h\">What you must do</div>\n    <div class=\"panel__h-ar\">ما الذي يجب عليك دراسته</div>\n    <ol class=\"steps\">\n      <li>Take all four red courses. No choice there.<span class=\"ar\">ادرس المقررات الأربعة الحمراء كلها، لا خيار فيها.</span></li><li>From each coloured group below, pick ONE course.<span class=\"ar\">من كل مجموعة ملونة أدناه اختر مقرراً واحداً.</span></li><li>Then pick two more courses freely.<span class=\"ar\">ثم اختر مقررين آخرين بحرية.</span></li><li>These come from other faculties, not from your college.<span class=\"ar\">هذه المقررات من كليات أخرى، وليست من كليتك.</span></li>\n    </ol>\n  </div>\n  <div class=\"panel panel--accent\">\n    <div class=\"panel__h\">What the colours mean</div>\n    <div class=\"panel__h-ar\">معنى الألوان</div>\n    <div class=\"key\">\n      \n      <div class=\"key__row\">\n        <span class=\"key__sw\" style=\"background:var(--c-core)\"></span>\n        <span class=\"key__txt\"><span class=\"key__en\">Red — take all four</span><span class=\"key__ar\">الأحمر — ادرس الأربعة كلها</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__sw\" style=\"background:var(--c-lang)\"></span>\n        <span class=\"key__txt\"><span class=\"key__en\">Blue — group 1, pick one</span><span class=\"key__ar\">الأزرق — المجموعة الأولى، اختر واحداً</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__sw\" style=\"background:var(--c-econ)\"></span>\n        <span class=\"key__txt\"><span class=\"key__en\">Orange — group 2, pick one</span><span class=\"key__ar\">البرتقالي — المجموعة الثانية، اختر واحداً</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__sw\" style=\"background:var(--c-math)\"></span>\n        <span class=\"key__txt\"><span class=\"key__en\">Green — group 3, pick one</span><span class=\"key__ar\">الأخضر — المجموعة الثالثة، اختر واحداً</span></span>\n      </div>\n      <div class=\"key__row\">\n        <span class=\"key__sw\" style=\"background:var(--c-support)\"></span>\n        <span class=\"key__txt\"><span class=\"key__en\">Olive — free choice, pick two</span><span class=\"key__ar\">الزيتوني — اختياري حر، اختر مقررين</span></span>\n      </div>\n      \n    </div>\n  </div>\n  <div class=\"panel panel--accent\">\n    <div class=\"panel__h\">Your whole degree</div>\n    <div class=\"panel__h-ar\">درجتك كاملة</div>\n    <div class=\"shape\">\n      \n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#D8C9C9\"></span>\n        <span class=\"shape__n\">61</span>\n        <span><span class=\"shape__t\">General courses</span><span class=\"shape__a\">المقررات العامة</span></span>\n      </div>\n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#A97B7B\"></span>\n        <span class=\"shape__n\">36</span>\n        <span><span class=\"shape__t\">College courses</span><span class=\"shape__a\">مقررات الكلية</span></span>\n      </div>\n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#660000\"></span>\n        <span class=\"shape__n\">27</span>\n        <span><span class=\"shape__t\">Your major</span><span class=\"shape__a\">مقررات التخصص</span></span>\n      </div>\n      <div class=\"shape__row\">\n        <span class=\"shape__sw\" style=\"background:#55632B\"></span>\n        <span class=\"shape__n\">6</span>\n        <span><span class=  class=\"crd__top\"><span class=\"crd__code\">1350101</span></div>\n    <div class=\"crd__body\">\n      <div class=\"crd__arname\">علم نفس</div>\n      <div class=\"crd__tr\">Psychology</div>\n    </div>\n  </div>\n  <div class=\"crd crd--el cat-core\" data-code=\"0310102\">\n    <div class=\"crd__top\"><span class=\"crd__code\">0310102</span></div>\n    <div class=\"crd__body\">\n      <div class=\"crd__arname\">جماليات الأدب العربي</div>\n      <div class=\"crd__tr\">Aesthetics of Arabic Literature</div>\n    </div>\n  </div>\n          </div>\n        </div>\n        <div class=\"stripe\" style=\"grid-row:2;--tint:rgba(31,78,121,.075)\"></div>\n        <div class=\"band\" style=\"grid-row:2;--tint-strong:#4A6E92;--band-ink:#fff\">\n          <span class=\"band__l\">Pick</span><span class=\"band__n\">1</span><span class=\"band__ar\">اختر</span></div>\n        <div class=\"gwrap\" style=\"grid-row:2;grid-column:2/14;--cat:var(--c-lang)\">\n          <div class=\"gtag\">\n            <span class=\"gtag__n\">PICK 1</span>\n            <span><span class=\"gtag__en\">Group 1 — in place of Arab-Islamic civilisation history</span> &nbsp;<span class=\"gtag__ar\">المجموعة الأولى ـ المقررات البديلة لتاريخ الحضارة العربية الإسلامية</span>\n              <span class=\"gtag__sub\">Choose one of these ten. &nbsp;·&nbsp; اختر واحداً من هذه العشرة.</span></span>\n            <span class=\"gtag__count\">10 courses<b>١٠ مقرراً</b></span>\n          </div>\n          <div class=\"subgrid\" style=\"grid-template-columns:repeat(5,1fr)\">\n            \n  <div class=\"crd crd--el cat-lang\" data-code=\"0900102\">\n    <div class=\"crd__top\"><span class=\"crd__code\">0900102</span></div>\n    <div class=\"crd__body\">\n      <div class=\"crd__arname\">الثقافة الإسلامية</div>\n      <div class=\"crd__tr\">Islamic Culture</div>\n    </div>\n  </div>\n  <div class=\"crd crd--el cat-lang\" data-code=\"0200105\">\n    <div class=\"crd__top\"><span class=\"crd__code\">0200105</span></div>\n <script>
(function(){
function draw(){
  var grid=document.getElementById('grid'), svg=document.getElementById('wires'); if(!grid||!svg) return;
  var gb=grid.getBoundingClientRect(), NS='http://www.w3.org/2000/svg';
  svg.setAttribute('viewBox','0 0 '+gb.width+' '+gb.height);
  svg.style.width=gb.width+'px'; svg.style.height=gb.height+'px';
  var CATS=['core','lang','math','acct','econ','biz','analytics','appdev','elective','support'];
  var head=function(id,fill){return '<marker id="'+id+'" viewBox="0 0 10 10" refX="7.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.4 L8.6,5 L0,8.6 z" fill="'+fill+'"/></marker>';};
  svg.innerHTML='<defs>'+head('ah','var(--wire-hard)')+head('ahs','var(--wire)')
    +CATS.map(function(k){return head('ah-'+k,'var(--c-'+k+')')}).join('')+'</defs>';

  var box={}; grid.querySelectorAll('.crd[data-code]').forEach(function(e){var r=e.getBoundingClientRect();
    box[e.dataset.code]={x:r.left-gb.left,y:r.top-gb.top,w:r.width,h:r.height};});

  /* anything a wire must never cross — labels AND cards. A wire may of course
     touch the card it starts at and the card it points to, so those are skipped
     per wire. */
  var obs=[];
  grid.querySelectorAll('.ztag,.orbox,.gatebox,.startbox,.stag').forEach(function(e){var r=e.getBoundingClientRect();
    obs.push({x:r.left-gb.left-4,y:r.top-gb.top-4,w:r.width+8,h:r.height+8,code:null});});
  grid.querySelectorAll('.crd[data-code]').forEach(function(e){var r=e.getBoundingClientRect();
    obs.push({x:r.left-gb.left-3,y:r.top-gb.top-3,w:r.width+6,h:r.height+6,code:e.dataset.code});});

  var add=function(d,cls,a,col,key,srcs){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class',cls);
    if(col)p.style.stroke=col;
    if(key)p.setAttribute('data-bus',key);
    if(srcs)p.setAttribute('data-srcs',srcs.join(','));
    if(a)p.setAttribute('marker-end','url(#'+a+')');svg.appendChild(p);};
  var dot=function(x,y,soft,col){var c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',1.7);
    if(col)c.style.fill=col; else if(soft)c.setAttribute('fill','var(--wire)');svg.appendChild(c);};
  var cx=function(b){return b.x+b.w/2}, bot=function(b){return b.y+b.h}, tp=function(b){return b.y-2};

  function blockers(x,y0,y1,skip){ return obs.filter(function(o){
    if(o.code && skip && skip.indexOf(o.code)>=0) return false;
    return x>o.x && x<o.x+o.w && y1>o.y && y0<o.y+o.h; }); }

  /* A vertical run that respects labels. If the label sits squarely on the
     line it becomes a station: the wire stops at its top edge and carries on
     from its bottom edge. Otherwise the wire steps around it.
     Returns an array of path strings; the last one carries the arrowhead. */
  function vpath(x,y0,y1,skip){
    var b=blockers(x,y0,y1,skip);
    if(!b.length) return ['M'+x+','+y0+' L'+x+','+y1];
    var top=Math.min.apply(null,b.map(function(o){return o.y}));
    var bt =Math.max.apply(null,b.map(function(o){return o.y+o.h}));
    var L=Math.min.apply(null,b.map(function(o){return o.x}));
    var R=Math.max.apply(null,b.map(function(o){return o.x+o.w}));
    var mid=(L+R)/2, wide=R-L;
    if(Math.abs(x-mid) < wide*0.3){
      var segs=[];
      if(top-y0>3) segs.push('M'+x+','+y0+' L'+x+','+top);
      if(y1-bt>3) segs.push('M'+x+','+bt+' L'+x+','+y1);
      return segs.length?segs:['M'+x+','+y0+' L'+x+','+y1];
    }
    var dx=(x-L)<=(R-x)?L-3:R+3;
    top=Math.max(top,y0+4); bt=Math.min(bt,y1-4);
    if(bt-top<4||Math.abs(dx-x)<4) return ['M'+x+','+y0+' L'+x+','+y1];
    var r=Math.min(2.6,Math.abs(dx-x)/2,(bt-top)/2), sg=dx>x?1:-1;
    return ['M'+x+','+y0
     +' L'+x+','+(top-r)+' Q'+x+','+top+' '+(x+sg*r)+','+top
     +' L'+(dx-sg*r)+','+top+' Q'+dx+','+top+' '+dx+','+(top+r)
     +' L'+dx+','+(bt-r)+' Q'+dx+','+bt+' '+(dx-sg*r)+','+bt
     +' L'+(x+sg*r)+','+bt+' Q'+x+','+bt+' '+x+','+(bt+r)
     +' L'+x+','+y1];
  }
  function addV(x,y0,y1,cls,arrow,skip,col,key,srcs){
    var ps=vpath(x,y0,y1,skip);
    ps.forEach(function(d,i){ add(d,cls, i===ps.length-1?arrow:null, col, key, srcs); });
  }

  var tgt={}, solos=[], bundles=[];
  (window.__WIRES__||[]).forEach(function(w){
    if(w.bundle){ bundles.push(w); return; }
    if(!box[w.s]||!box[w.t])return;
    if(w.solo){solos.push(w);return;}
    var e=(tgt[w.t]=tgt[w.t]||{s:[],k:w.k,cats:[]}); e.s.push(w.s); e.cats.push(w.cat||''); });
  var buses={};
  Object.keys(tgt).forEach(function(t){ var key=tgt[t].s.slice().sort().join('|');
    (buses[key]=buses[key]||{key:key,srcs:tgt[t].s,ts:[],k:tgt[t].k,cats:tgt[t].cats}).ts.push(t); });

  var busList=Object.keys(buses).map(function(k){return buses[k]});

  /* A course that feeds more than one group sends each group out of a different
     point along its bottom edge. Two runs then never leave the same spot, so
     one can never appear to cut through the other. */
  var srcUse={}, tgtUse={};
  busList.forEach(function(b){
    b.srcs.forEach(function(s){ (srcUse[s]=srcUse[s]||[]).push(b); });
    b.ts.forEach(function(t){ (tgtUse[t]=tgtUse[t]||[]).push(b); });
  });
  var meanX=function(codes){var t=0;codes.forEach(function(c){t+=box[c].x+box[c].w/2});return t/codes.length;};
  /* THE EXIT MUST MATCH THE DIRECTION. The run that heads right leaves from the
     right of the card; the one that heads left leaves from the left. Assign the
     lanes in any other order and the two runs swap sides and cross each other
     directly under the card. */
  var srcLane={}, tgtLane={};
  var assign=function(use,store,pull){
    Object.keys(use).forEach(function(code){
      var r=box[code], list=use[code].slice();
      list.sort(function(a,b){ return meanX(pull(a))-meanX(pull(b)); });
      list.forEach(function(b,i){
        store[code+'|'+b.key] = list.length>1 ? r.x + r.w*((i+1)/(list.length+1)) : r.x + r.w/2;
      });
    });
  };
  assign(srcUse, srcLane, function(b){return b.ts});
  assign(tgtUse, tgtLane, function(b){return b.srcs});
  var lane=function(store,code,b){ return store[code+'|'+b.key]; };

  busList.forEach(function(b){
    b.S=b.srcs.map(function(x){return box[x]}); b.T=b.ts.map(function(x){return box[x]});
    b.SX=b.srcs.map(function(c){return lane(srcLane,c,b)});
    b.TX=b.ts.map(function(c){return lane(tgtLane,c,b)});
    var xs=b.SX.concat(b.TX);
    b.lo=Math.min.apply(null,xs); b.hi=Math.max.apply(null,xs);
    b.mb=Math.max.apply(null,b.S.map(bot));
  });
  /* Deciding which run is drawn nearer the cards. For an upper run U and a
     lower run L, two things must both hold, or a line gets cut:
       - L's horizontal must not pass under where U drops into its cards
       - U's horizontal must not pass over where L climbs out of its cards
     (U's drops reach down past L's line; L's climbs reach up past U's line.) */
  var inSpan=function(x,b){ return x>b.lo-1 && x<b.hi+1; };
  var okAbove=function(u,l){
    if(u.TX.some(function(x){return inSpan(x,l);})) return false;
    if(l.SX.some(function(x){return inSpan(x,u);})) return false;
    return true;
  };
  /* Only runs that leave the same row of cards can collide, so order each of
     those groups on its own — otherwise an unrelated run blocks the reordering. */
  var gaps={};
  busList.forEach(function(b){ var g=Math.round(b.mb/6); (gaps[g]=gaps[g]||[]).push(b); });
  busList=[];
  Object.keys(gaps).map(Number).sort(function(a,b){return a-b;}).forEach(function(g){
    var grp=gaps[g];
    for(var pa=0;pa<grp.length;pa++){
      for(var pb=0;pb<grp.length-1;pb++){
        var u=grp[pb], v=grp[pb+1], swap=false;
        if(!okAbove(u,v) && okAbove(v,u)) swap=true;
        else if(okAbove(u,v) && okAbove(v,u)){
          var du=(u.srcs.length>1?0:1), dv=(v.srcs.length>1?0:1);
          if(dv<du) swap=true; else if(dv===du && v.lo<u.lo) swap=true;
        }
        if(swap){ grp[pb]=v; grp[pb+1]=u; }
      }
    }
    grp.forEach(function(b){ busList.push(b); });
  });

  var placed=[];
  busList.forEach(function(b){
    var S=b.S, T=b.T, SX=b.SX, TX=b.TX;
    var mb=Math.max.apply(null,S.map(bot)), mt=Math.min.apply(null,T.map(tp));
    if(mt-mb<5) return;
    var x0=b.lo, x1=b.hi;
    var ends=b.srcs.concat(b.ts);
    var y=Math.min(mb+(mt-mb)/2, mb+13);
    for(var pass=0;pass<4;pass++){
      obs.forEach(function(o){
        if(o.code && ends.indexOf(o.code)>=0) return;
        if(x1>o.x && x0<o.x+o.w && y>o.y && y<o.y+o.h) y=Math.min(o.y+o.h+4, mt-4);
      });
    }
    for(var g=0;g<10;g++){
      var clash=placed.some(function(q){return Math.abs(q.y-y)<3.4 && x1>q.x0-2 && x0<q.x1+2;});
      if(!clash) break;
      if(y+4.2>mt-4) break;
      y+=4.2;
    }
    placed.push({x0:x0,x1:x1,y:y});

    var one = b.srcs.length===1 && b.cats[0];
    var col = one ? 'var(--c-'+b.cats[0]+')' : null;
    var arw = one ? 'ah-'+b.cats[0] : (b.k==='wire--soft'?'ahs':'ah');
    if(x1-x0>1.5) add('M'+x0+','+y+' L'+x1+','+y,b.k,null,col,b.key,b.srcs);
    S.forEach(function(s,i){
      var sc = col || (b.cats[i] ? 'var(--c-'+b.cats[i]+')' : null);
      addV(SX[i],bot(s),y,b.k,null,ends,sc,b.key,b.srcs);
      if(x1-x0>1.5) dot(SX[i],y,false,sc); });
    T.forEach(function(t,i){ addV(TX[i],y,tp(t),b.k,arw,ends,col,b.key,b.srcs); });
  });

  /* every course in a path bundles into one line that leaves from the middle
     course and carries on to the capstone */
  bundles.forEach(function(b){
    var S=b.srcs.map(function(c){return box[c]}).filter(Boolean), T=box[b.t];
    if(!S.length||!T||!box[b.stem]) return;
    var mb=Math.max.apply(null,S.map(bot));
    var busY=mb+11;
    var ey=tp(T);
    if(ey-busY<18) busY=mb+10;
    var xs=S.map(cx), x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
    var bk='bundle'+b.lane+':'+b.t;
    S.forEach(function(s){ add('M'+cx(s)+','+bot(s)+' L'+cx(s)+','+busY,b.k,null,null,bk,b.srcs); });
    add('M'+x0+','+busY+' L'+x1+','+busY,b.k,null,null,bk,b.srcs);
    S.forEach(function(s){ dot(cx(s),busY,true); });
    var sx=cx(box[b.stem]), ex=T.x+T.w*b.entry;
    var my=busY+(ey-busY)*(0.62+0.16*b.lane);
    var r=Math.min(5,Math.abs(ex-sx)/2,Math.abs(my-busY),Math.abs(ey-my)), g=ex>sx?1:-1;
    var d='M'+sx+','+busY+' L'+sx+','+(my-r)+' Q'+sx+','+my+' '+(sx+g*r)+','+my
         +' L'+(ex-g*r)+','+my+' Q'+ex+','+my+' '+ex+','+(my+r)+' L'+ex+','+ey;
    add(d,b.k,'ahs',null,bk,b.srcs);
  });

  var tally={}; solos.forEach(function(w){tally[w.t]=(tally[w.t]||0)+1}); var seen={};
  solos.forEach(function(w){ var s=box[w.s], t=box[w.t];
    var n=tally[w.t], i=(seen[w.t]=(seen[w.t]||0)+1)-1;
    var sy=bot(s), ey=tp(t), sx=cx(s), ex=n>1?t.x+t.w*((i+1)/(n+1)):cx(t);
    if(ey-sy<5) return;
    var my=sy+(ey-sy)*(n>1?0.55+0.22*i:0.6);
    for(var pass=0;pass<3;pass++){
      obs.forEach(function(o){
        if(Math.max(sx,ex)>o.x && Math.min(sx,ex)<o.x+o.w && my>o.y && my<o.y+o.h) my=Math.min(o.y+o.h+4, ey-4);
      });
    }
    var r=Math.min(5,Math.abs(ex-sx)/2,Math.abs(my-sy),Math.abs(ey-my)), g=ex>sx?1:-1, d;
    if(Math.abs(ex-sx)<1.5){ addV(sx,sy,ey,w.k,'ahs',[w.s,w.t]); return; }
    d='M'+sx+','+sy+' L'+sx+','+(my-r)+' Q'+sx+','+my+' '+(sx+g*r)+','+my+' L'+(ex-g*r)+','+my+' Q'+ex+','+my+' '+ex+','+(my+r)+' L'+ex+','+ey;
    add(d,w.k,'ahs'); });

  document.documentElement.setAttribute('data-wires','done');
}
window.__drawWires=draw;
})();</script>
<script>
const PG = JSON.parse(document.getElementById('PAGES').textContent);
const P  = JSON.parse(document.getElementById('PLAN').textContent);
const AS = JSON.parse(document.getElementById('ASSETS').textContent);
document.getElementById('mark').src = AS['isom-logo.png'];

const PW = 594 * 96 / 25.4, PH = 420 * 96 / 25.4;   /* the sheet, in CSS pixels */
const S = { step:0, major:null, done:new Set(), freeDone:0, perTerm:5, summer:2, start:0, z:null };
const STEPS = ['major','general','majormap','electives','pace','result'];
const CO = c => P.courses[c] || {en:c, ar:'', cat:'core', pre:[]};
const PRE = c => { const o = S.major && P.majors[S.major].pre_override; return (o&&o[c]) ? o[c] : (CO(c).pre||[]); };
const phone = () => window.innerWidth < 760;

/* ---------- what is still owed ---------- */
function outstanding(){
  const M = P.majors[S.major], need = [], open = [];
  const used = new Set();
  const all = (cs,w) => cs.forEach(c => { if(!S.done.has(c)) need.push({c,why:w}); });
  const pick = (cs,n,w,cat,shared) => {
    const got = cs.filter(c=>S.done.has(c) && !(shared && used.has(c))).slice(0,n);
    if(shared) got.forEach(c=>used.add(c));
    const left = n - got.length;
    const pool = cs.filter(c=>!S.done.has(c));
    for(let i=0;i<left && i<pool.length;i++) need.push({c:pool[i],why:w,sug:true});
    if(left>pool.length) for(let i=0;i<left-pool.length;i++) open.push({why:w,cat});
  };
  all(P.general,'general');
  all(P.electives.must,'elective');
  P.electives.groups.forEach(g=>pick(g.codes,g.pick,'elective',g.cat,true));
  for(let i=0;i<P.electives.free-S.freeDone;i++) open.push({why:'free',cat:'support'});
  all(M.must,'major');
  if(M.paths.length){
    let best=M.paths[0], sc=-1;
    M.paths.forEach(p=>{const s=(S.done.has(p.top)?2:0)+p.codes.filter(c=>S.done.has(c)).length; if(s>sc){sc=s;best=p;}});
    all([best.top],'major'); pick(best.codes,best.pick,'major',best.cat);
  }
  M.choose.forEach(g=>pick(g.codes,g.pick,'major',g.cat));
  pick(M.support.codes,M.support.pick,'support',M.support.cat);
  return {need,open};
}
function totalSlots(){
  const M=P.majors[S.major];
  return P.general.length + P.electives.must.length + P.electives.groups.length + P.electives.free
    + M.must.length + (M.paths.length ? 1+M.paths[0].pick : 0)
    + M.choose.reduce((a,g)=>a+g.pick,0) + M.support.pick;
}
const TERMS = (()=>{const o=[];for(let y=2026;y<=2070;y++){
  o.push({en:'Fall '+y,ar:'خريف '+y,cap:'n'});
  o.push({en:'Spring '+(y+1),ar:'ربيع '+(y+1),cap:'n'});
  o.push({en:'Summer '+(y+1),ar:'صيف '+(y+1),cap:'s'});}return o;})();

function schedule(){
  const {need,open} = outstanding();
  const passed = new Set(S.done);
  let pool = need.slice(), blank = open.slice();
  const out = []; let ti = S.start, guard = 0;
  while((pool.length||blank.length) && guard++ < 400){
    const T = TERMS[ti++]; if(!T) break;
    const cap = T.cap==='s' ? S.summer : S.perTerm;
    if(cap < 1) continue;
    const ready = pool.filter(x=>{
      const c = CO(x.c);
      if(c.after_credits && passed.size < Math.ceil(c.after_credits/3)) return false;
      return PRE(x.c).every(p=>passed.has(p));
    });
    const put = ready.slice(0,cap);
    while(put.length<cap && blank.length) put.push(blank.shift());
    if(!put.length){ if(!pool.length) break; out.push({T,list:[],stuck:true}); break; }
    put.forEach(x=>{ if(x.c){ passed.add(x.c); pool = pool.filter(y=>y!==x); } });
    out.push({T,list:put});
  }
  return out;
}

/* ---------- the sheet on screen ---------- */
const MAPOF = { general:'general', electives:'electives' };
function mapName(){ const st=STEPS[S.step]; return st==='majormap' ? S.major : MAPOF[st]; }

function fitZoom(){
  const w = document.getElementById('main').clientWidth - (phone()?0:24);
  const f = w / PW;
  return phone() ? 0.9 : Math.min(1, Math.max(f, 0.46));
}
function applyZoom(){
  const st = document.querySelector('.stage'); if(!st) return;
  const pg = st.querySelector('.page'), sz = st.querySelector('.sizer');
  pg.style.transform = 'scale('+S.z+')';
  sz.style.width  = (PW*S.z)+'px';
  sz.style.height = (PH*S.z)+'px';
  const zb = document.getElementById('zoom');
  const pct = zb.querySelector('.z--w'); if(pct) pct.textContent = Math.round(S.z*100)+'%';
}
/* Every "PICK 1", "PICK 3", "TAKE BOTH" printed on a sheet is a rule the app
   now holds you to: once a group is full the rest of it locks, and choosing a
   path closes the other one. Untick and they open again. */
let GS = [];
function groupsFor(map){
  if(map === 'electives') return P.electives.groups.map(g => ({codes:g.codes, max:g.pick, shared:true}));
  const M = P.majors[map]; if(!M) return [];
  const out = [];
  M.paths.forEach(p => out.push({codes:p.codes, max:p.pick}));
  M.choose.forEach(g => out.push({codes:g.codes, max:g.pick}));
  out.push({codes:M.support.codes, max:M.support.pick});
  return out.filter(g => g.max < g.codes.length);      /* take-all needs no lock */
}
function tagGroups(){
  const els = [...document.querySelectorAll('.stage .crd[data-code]')];
  const taken = new Set();
  GS.forEach((g, gi) => g.codes.forEach(code => {
    const el = els.find(e => !taken.has(e) && e.dataset.code === code);
    if(el){ taken.add(el); el.dataset.grp = gi; }
  }));
}
/* a course that sits in two groups is credited to one of them, as the sheet's
   own footnote says: it counts once */
function fullness(){
  const used = new Set();
  return GS.map(g => {
    const got = g.codes.filter(c => S.done.has(c) && !(g.shared && used.has(c))).slice(0, g.max);
    if(g.shared) got.forEach(c => used.add(c));
    return got.length >= g.max;
  });
}
function deadPath(){
  const M = S.major && P.majors[S.major];
  if(mapName() !== S.major || !M || M.paths.length !== 2) return null;
  const on = M.paths.map(p => [p.top].concat(p.codes).some(c => S.done.has(c)));
  if(on[0] && !on[1]) return 1;
  if(on[1] && !on[0]) return 0;
  return null;
}
function applyLocks(){
  const full = fullness(), dp = deadPath();
  const M = S.major && P.majors[S.major];
  const shut = dp === null ? [] : [M.paths[dp].top].concat(M.paths[dp].codes);
  document.querySelectorAll('.stage .crd[data-code]').forEach(e => {
    const c = e.dataset.code, done = S.done.has(c);
    const gi = e.dataset.grp;
    const lock = !done && ((gi !== undefined && full[+gi]) || shut.indexOf(c) >= 0);
    e.classList.toggle('is-lock', lock);
  });
}
const HT = {};
function pageHtml(name){
  if(HT[name]) return HT[name];
  let h = PG[name].html;
  for(const k in AS) h = h.split('@@'+k).join(AS[k]);
  return (HT[name] = h);
}
function mountMap(name){
  const slot = document.getElementById('slot');
  const free = name === 'electives'
    ? '<span class="free">Free electives already passed'+
      [0,1,2].map(n=>'<button class="fo '+(S.freeDone===n?'on':'')+'" data-fr="'+n+'">'+n+'</button>').join('')+
      '<b class="arb">الاختيارية الحرة المجتازة</b></span>'
    : '';
  slot.innerHTML =
    '<div class="stage"><div class="sizer">'+pageHtml(name)+'</div></div>'+
    '<div class="hint"><span>Tap a course to mark it <b>passed</b>. Drag the map to move around it.</span>'+
    free+'<span class="arb">المس المقرر لتعليمه <b>مجتازاً</b>. اسحب الخريطة للتنقل فيها.</span></div>';
  window.__WIRES__ = JSON.parse(PG[name].wires);
  if(window.__drawWires) window.__drawWires();        /* drawn at true size, then scaled */
  GS = groupsFor(name); tagGroups();
  if(S.z == null) S.z = fitZoom();
  applyZoom();
  syncTicks();
  /* open on the map itself, not on the sheet's margins */
  const st = slot.querySelector('.stage');
  const pg = st.querySelector('.page'), body = st.querySelector('.body');
  if(pg && body){
    const b = body.getBoundingClientRect(), p = pg.getBoundingClientRect();
    st.scrollLeft = Math.max(0, (b.left - p.left) - 6);
    st.scrollTop  = Math.max(0, (b.top  - p.top ) - 6);
  }
}
function syncTicks(){
  document.querySelectorAll('.stage .crd[data-code]').forEach(e=>{
    e.classList.toggle('is-done', S.done.has(e.dataset.code));
  });
  applyLocks();
  const n = document.getElementById('nv'); if(n) n.innerHTML = nav();
}
/* "Tick all" must obey the same rules as tapping: it fills a sheet the way a
   student legally could, never both paths and never more than a group's pick. */
function tickAllLegal(){
  const map = mapName();
  mapCodes().forEach(c=>S.done.delete(c));
  if(map === 'general'){ mapCodes().forEach(c=>S.done.add(c)); return; }
  const M = P.majors[S.major];
  const skip = (map === S.major && M && M.paths.length === 2)
    ? [M.paths[1].top].concat(M.paths[1].codes) : [];
  document.querySelectorAll('.stage .crd[data-code]:not(.crd--gate)').forEach(e=>{
    if(e.dataset.grp === undefined && skip.indexOf(e.dataset.code) < 0) S.done.add(e.dataset.code);
  });
  GS.forEach(g=>{
    /* prefer a course that belongs to this group alone, so a shared one is
       not spent here and left looking like an extra pick in its other group */
    const others = new Set(GS.filter(x => x !== g).reduce((a,x)=>a.concat(x.codes), []));
    const pool = g.codes.filter(c => skip.indexOf(c) < 0 && !S.done.has(c));
    const pref = pool.filter(c => !others.has(c)).concat(pool.filter(c => others.has(c)));
    pref.slice(0, g.max).forEach(c=>S.done.add(c));
  });
}
function mapCodes(){
  return [...document.querySelectorAll('.stage .crd[data-code]:not(.crd--gate)')]
    .map(e=>e.dataset.code).filter((c,i,a)=>a.indexOf(c)===i);
}

/* ---------- plain screens ---------- */
function screenMajor(){
  return '<div class="pan"><div class="pan__in">'+
   '<h1 class="h">Which major are you in?</h1><div class="h-ar">ما تخصصك؟</div>'+
   '<div class="p">Pick one. The next screens are your own printed course map — the same one in the guide.'+
   '<span class="arb">اختر تخصصك. الشاشات التالية هي خريطة مقرراتك المطبوعة نفسها الموجودة في الدليل.</span></div>'+
   '<div class="majs">'+Object.keys(P.majors).map(k=>{const m=P.majors[k];
     return '<button class="maj '+(S.major===k?'on':'')+'" data-m="'+k+'">'+
       '<span class="maj__t"><span class="maj__c">MAJOR '+m.code+'</span>'+
       '<span class="maj__en">'+m.en+'</span><span class="maj__ar">'+m.ar+'</span></span>'+
       '<span class="maj__b">9 major courses, 2 supporting courses, and the 25 general and college courses everyone takes.'+
       '<span class="arb">9 مقررات تخصص، ومقرران مساندان، و25 مقرراً عاماً ومقررات كلية يدرسها الجميع.</span></span></button>';
   }).join('')+'</div></div></div>';
}
function screenPace(){
  const o = outstanding(), left = o.need.length+o.open.length;
  const row = (key,vals,cur,lbl) => vals.map(n=>
    '<button class="opt '+(cur===n?'on':'')+'" data-'+key+'="'+n+'">'+n+
    (lbl&&n===0?'<small>SKIP</small>':'')+'</button>').join('');
  return '<div class="pan"><div class="pan__in">'+
   '<h1 class="h">How fast do you want to go?</h1><div class="h-ar">بأي سرعة تريد أن تتقدم؟</div>'+
   '<div class="p">You have <b>'+left+'</b> '+(left===1?'course':'courses')+' left. Set your pace and see the term you finish.'+
   '<span class="arb">بقي لك '+left+' '+(left===1?'مقرر':'مقرراً')+'. حدّد سرعتك لترى الفصل الذي تتخرج فيه.</span></div>'+
   '<div class="pace">'+
    '<div class="bx"><div class="bx__h">Courses each normal semester</div><div class="bx__ha">عدد المقررات في الفصل العادي</div>'+
      '<div class="opts">'+row('p',[1,2,3,4,5,6],S.perTerm)+'</div>'+
      '<div class="cap">Six is the most the college lets you register for in a normal semester.'+
      '<span class="arb">ستة مقررات هو الحد الأعلى المسموح به في الفصل العادي.</span></div></div>'+
    '<div class="bx" style="border-left-color:#C9A227"><div class="bx__h">Courses each summer</div><div class="bx__ha">عدد المقررات في الفصل الصيفي</div>'+
      '<div class="opts">'+row('s',[0,1,2,3],S.summer,1)+'</div>'+
      '<div class="cap">Summer takes one course at the least and three at the most. Choose 0 to skip summers.'+
      '<span class="arb">الفصل الصيفي مقرر واحد على الأقل وثلاثة على الأكثر. اختر 0 لتخطي الصيف.</span></div></div>'+
    '<div class="bx" style="border-left-color:var(--c-lang)"><div class="bx__h">Start from</div><div class="bx__ha">ابدأ من</div>'+
      '<div class="opts">'+[0,1,2,3].map(i=>'<button class="opt '+(S.start===i?'on':'')+'" data-t="'+i+'" style="min-width:auto;font-size:14px">'+
        TERMS[i].en+'<small>'+TERMS[i].ar+'</small></button>').join('')+'</div>'+
      '<div class="cap">The first semester you will register in.<span class="arb">أول فصل ستسجّل فيه.</span></div></div>'+
   '</div></div></div>';
}
function screenResult(){
  const pl = schedule(), o = outstanding();
  const left = o.need.length+o.open.length, total = totalSlots(), got = total-left;
  if(!left) return '<div class="pan"><div class="pan__in"><h1 class="h">You are done.</h1>'+
    '<div class="h-ar">لقد أنهيت كل شيء.</div><div class="p">All '+total+' courses are ticked. Go and see your advisor about graduating.'+
    '<span class="arb">جميع المقررات الـ'+total+' مكتملة. راجع مرشدك الأكاديمي بخصوص التخرج.</span></div></div></div>';
  const last = pl.length ? pl[pl.length-1].T : TERMS[S.start];
  const yrs = pl.filter(t=>t.T.cap==='n').length/2;
  return '<div class="pan"><div class="pan__in">'+
   '<h1 class="h">Here is what is left</h1><div class="h-ar">هذا ما بقي عليك</div>'+
   '<div class="big">'+
     '<div><div class="big__n">'+left+'</div><div class="big__l">courses left of '+total+
       '<span class="big__la">مقرراً باقياً من '+total+'</span></div></div>'+
     '<div><div class="big__n">'+pl.length+'</div><div class="big__l">semesters, summers included'+
       '<span class="big__la">فصلاً دراسياً، بما فيها الصيف</span></div></div>'+
     '<div><div class="big__n" style="font-size:42px">'+last.en+'</div><div class="big__l">is when you finish'+
       '<span class="big__la">هو موعد تخرجك — '+last.ar+'</span></div></div>'+
   '</div>'+
   '<div class="sum">You have passed <b>'+got+'</b> of '+total+'. Taking '+S.perTerm+' a semester'+
     (S.summer?' and '+S.summer+' each summer':' and skipping summers')+', that is about '+yrs.toFixed(1)+
     ' more academic '+(yrs===1?'year':'years')+'.'+
     '<span class="arb">اجتزت '+got+' من '+total+'. بدراسة '+S.perTerm+' في الفصل'+
     (S.summer?' و'+S.summer+' في كل صيف':' وتخطي الصيف')+'، يتبقى نحو '+yrs.toFixed(1)+' سنة دراسية.</span></div>'+
   '<div class="terms">'+pl.map(t=>'<div class="tm '+(t.T.cap==='s'?'tm--s':'')+'">'+
     '<div class="tm__h"><span class="tm__n">'+t.T.en+'</span><span class="tm__a">'+t.T.ar+'</span></div>'+
     '<div class="tm__b">'+t.list.map(x=>{
       if(!x.c) return '<div class="tm__c"><span class="tm__code" style="--cat:var(--c-support)">FREE</span>'+
         '<span class="tm__x"><span class="tm__en">Free elective — your own choice</span>'+
         '<span class="tm__ar">مقرر اختياري حر — من اختيارك</span></span></div>';
       const c = CO(x.c);
       return '<div class="tm__c"><span class="tm__code" style="--cat:var(--c-'+c.cat+')">'+x.c+'</span>'+
         '<span class="tm__x"><span class="tm__en">'+c.en+'</span><span class="tm__ar">'+c.ar+'</span>'+
         (x.sug?'<span class="tm__s">SUGGESTED · مقترح</span>':'')+'</span></div>';
     }).join('')+'</div></div>').join('')+'</div>'+
   '<div class="nt">This plan follows the prerequisite lines drawn on your map, and assumes every course is offered in the term it lands in. Always check your own plan in the portal before you register.'+
   '<span class="arb">يتبع هذا المخطط المتطلبات السابقة المرسومة على خريطتك، ويفترض أن كل مقرر يُطرح في الفصل الذي وُضع فيه. راجع خطتك في نظام التسجيل قبل كل تسجيل.</span></div>'+
   '<div class="ftr"><b>ISOM Club</b> · Kuwait University · College of Business Administration<br>'+
   'Built from the club\'s 2026 / 2027 student guide.'+
   '<span class="arb">مبني على دليل الطالب 2026 / 2027 الصادر عن النادي.</span></div>'+
   '</div></div>';
}

/* ---------- chrome ---------- */
function nav(){
  const st = STEPS[S.step], last = S.step===STEPS.length-1;
  let mid = '';
  if(st==='general'||st==='majormap'||st==='electives'){
    const cs = mapCodes(), on = cs.filter(c=>S.done.has(c)).length;
    const allOn = on>=cs.length && cs.length>0;
    mid = '<span class="st"><b>'+on+'</b>'+(phone()?' / ':' of ')+cs.length+(phone()?'':' ticked')+
      '<span class="arb">مؤشَّر عليها</span></span>'+
      '<button class="all" data-all="'+(allOn?0:1)+'">'+(allOn?'Clear · امسح':'Tick all · حدد الكل')+'</button>';
  } else if(st==='pace'){ const o=outstanding(); mid='<span class="st"><b>'+(o.need.length+o.open.length)+'</b> left<span class="arb">مقرراً باقياً</span></span>'; }
  else mid = '<span class="st"></span>';
  return (S.step?'<button class="btn btn--g" id="back">Back<span class="arb">رجوع</span></button>':'')+mid+
    (last ? '<button class="btn btn--g" id="again">Start again<span class="arb">ابدأ من جديد</span></button>'
          : '<button class="btn" id="next" '+((st==='major'&&!S.major)?'disabled':'')+'>'+
            (S.step===4?'Show me':'Next')+'<span class="arb">'+(S.step===4?'أرني النتيجة':'التالي')+'</span></button>');
}
function zoomBar(){
  const m = mapName();
  document.getElementById('zoom').innerHTML = m
    ? '<button class="z" data-z="-">−</button><button class="z z--w" data-z="fit">FIT</button><button class="z" data-z="+">+</button>'
    : '';
  if(m) applyZoom();
}
function paint(){
  const st = STEPS[S.step], m = mapName();
  if(m) mountMap(m);
  else document.getElementById('slot').innerHTML =
    st==='major' ? screenMajor() : st==='pace' ? screenPace() : screenResult();
  document.getElementById('nv').innerHTML = nav();
  document.getElementById('bar').innerHTML = STEPS.map((_,i)=>'<i class="'+(i<=S.step?'on':'')+'"></i>').join('');
  zoomBar();
}
function render(go){
  save();
  const slot = document.getElementById('slot');
  if(go===undefined){ paint(); return; }
  slot.classList.add('fade');
  setTimeout(()=>{ S.step = go; S.z = null; paint(); slot.classList.remove('fade'); }, 170);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const z = e.target.closest('[data-z]');
  if(z){ const k=z.dataset.z;
    S.z = k==='fit' ? fitZoom() : Math.min(1.6, Math.max(0.28, S.z + (k==='+'?0.12:-0.12)));
    return applyZoom(); }
  const crd = e.target.closest('.stage .crd[data-code]');
  if(crd){ const c=crd.dataset.code;
    S.done.has(c) ? S.done.delete(c) : S.done.add(c);
    crd.classList.toggle('is-done', S.done.has(c)); save(); return syncTicks(); }
  const fr = e.target.closest('[data-fr]');
  if(fr){ S.freeDone = +fr.dataset.fr; save();
    fr.parentNode.querySelectorAll('.fo').forEach(b=>b.classList.toggle('on', b===fr)); return; }
  const a = e.target.closest('[data-all]');
  if(a){ a.dataset.all==='1' ? tickAllLegal() : mapCodes().forEach(c=>S.done.delete(c));
    save(); return syncTicks(); }
  const t = e.target.closest('[data-m],[data-p],[data-s],[data-t],#next,#back,#again');
  if(!t) return;
  if(t.dataset.m){ S.major=t.dataset.m; return render(); }
  if(t.dataset.p){ S.perTerm=+t.dataset.p; return render(); }
  if(t.dataset.s){ S.summer=+t.dataset.s; return render(); }
  if(t.dataset.t){ S.start=+t.dataset.t; return render(); }
  if(t.id==='next') return render(S.step+1);
  if(t.id==='back') return render(S.step-1);
  if(t.id==='again'){ S.done=new Set(); S.freeDone=0; S.major=null; return render(0); }
});
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(mapName()){ S.z=fitZoom(); applyZoom(); } },180); });

/* ---------- remembered on this device only ---------- */
const KEY='isom-graduate-v2';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({major:S.major,done:[...S.done],
  freeDone:S.freeDone,perTerm:S.perTerm,summer:S.summer,start:S.start})); }catch(e){} }
(function load(){ try{ const v=JSON.parse(localStorage.getItem(KEY)||'null'); if(!v) return;
  if(v.major&&P.majors[v.major]) S.major=v.major;
  if(Array.isArray(v.done)) S.done=new Set(v.done.filter(c=>P.courses[c]));
  if(typeof v.freeDone==='number') S.freeDone=Math.min(2,Math.max(0,v.freeDone));
  if(typeof v.perTerm==='number') S.perTerm=Math.min(6,Math.max(1,v.perTerm));
  if(typeof v.summer==='number') S.summer=Math.min(3,Math.max(0,v.summer));
  if(typeof v.start==='number') S.start=Math.min(3,Math.max(0,v.start));
}catch(e){} })();

if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(mapName()) { mountMap(mapName()); } });
paint();
</script>
