<style>
/* ===== the app around the sheet =====
   It speaks the printed guide's language: paper, maroon, the course card with
   its coloured bar, and a maroon wash that deepens down the page. */
:root{--a-ink:#2E2726;--a-ink2:#5E5553;--a-line:#DCD7D6;--a-paper:#F5F5F5}
html,body{height:100%;margin:0;background:var(--a-paper);overscroll-behavior:none}
body{font-family:DMSans,Tajawal,system-ui,sans-serif;color:var(--a-ink);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}
/* Arabic sits under the English at the same size, aligned to its own side */
.arb{font-family:Tajawal,sans-serif;direction:rtl;text-align:right;display:block}

/* header: the club mark, and the name of the screen you are on — set the way
   the sheet sets its own title, English over Arabic on one centre line */
.ap{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px 8px;background:#fff;z-index:30}
.ap__logo{height:52px;width:auto;display:block;flex:none}
.ap__t{flex:1;min-width:0;text-align:center}
.ap__en{display:block;font-family:BarlowC,Cairo,sans-serif;font-weight:700;font-style:italic;
  font-size:24px;line-height:1.05;color:var(--maroon);text-wrap:balance}
.ap .ap__ar{font-family:Cairo,sans-serif;font-weight:700;font-size:24px;line-height:1.55;
  color:var(--maroon);text-align:center;text-wrap:balance}
.ap__sp{display:none;flex:none}
.bar{flex:none;display:flex;gap:4px;padding:0 16px 10px;background:#fff;border-bottom:1px solid var(--a-line)}
.bar i{height:4px;flex:1;border-radius:9px;background:#E6DFDE}
.bar i.on{background:var(--maroon)}

#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#slot{flex:1;min-height:0;display:flex;flex-direction:column;transition:opacity .17s ease}
.fade{opacity:0}

/* ---------- a sheet on screen ---------- */
.chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:#fff;
  border-bottom:1px solid var(--a-line);scrollbar-width:none;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:48px;padding:5px 12px 4px;border-radius:10px;border:1.5px solid var(--a-line);
  background:#fff;display:flex;align-items:center;gap:8px;text-align:left;line-height:1.2}
.chip__sw{width:10px;height:28px;border-radius:3px;background:var(--sw,#E4CDCD);flex:none}
.chip__t{display:block;font-weight:700;font-size:14px;color:var(--a-ink);white-space:nowrap}
.chip__t .arb{font-weight:500;font-size:14px;line-height:1.5;color:var(--a-ink)}
.chip.on{border-color:var(--maroon);box-shadow:0 0 0 1.5px var(--maroon) inset}
.mapwrap{flex:1;min-height:0;position:relative;display:flex}
.stage{flex:1;min-height:0;overflow:auto;background:#E9E5E4;-webkit-overflow-scrolling:touch;position:relative}
.sizer{position:relative}
.stage .page{position:absolute;left:0;top:0;margin:0;transform-origin:0 0;
  box-shadow:0 2px 14px rgba(0,0,0,.14)}
.zm{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:20}
.zm button{width:48px;height:48px;border-radius:12px;background:#fff;border:1.5px solid var(--a-line);
  box-shadow:0 1px 5px rgba(0,0,0,.18);font-weight:700;font-size:24px;line-height:1;color:var(--maroon);
  display:grid;place-items:center}
.zm button:active{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.hint{flex:none;padding:8px 16px;font-size:14px;line-height:1.35;color:var(--a-ink2);background:#fff;
  border-top:1px solid var(--a-line)}
.hint b{color:var(--maroon)}
.hint .arb{font-size:14px;line-height:1.6}
.free{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;
  border-top:1px solid var(--a-line)}
.free__t{flex:1 1 auto;min-width:0;max-width:440px;font-weight:700;font-size:14px;line-height:1.3;color:var(--a-ink)}
.free__t .arb{font-weight:500;font-size:14px;line-height:1.55}
.fo{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--a-line);background:#fff;flex:none;
  font-weight:700;font-size:18px;color:var(--maroon);font-variant-numeric:tabular-nums}
.fo.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* A sheet inside the app carries no university crest, and no second club mark:
   the app's own header holds the club's. They are hidden rather than removed so
   the sheet's geometry — and the title's centre line over the course columns —
   stays exactly as printed. */
.stage .hd__crest,.stage .hd__club{visibility:hidden}
/* no point showing a code for the site you are already standing on */
.stage .ft__scan{display:none}

/* ticking a course, right on the map */
.stage .crd[data-code]{cursor:pointer;transition:box-shadow .12s,transform .08s}
.stage .crd[data-code]:active{transform:scale(.99)}
.stage .crd[data-code]::after{
  content:'';position:absolute;right:2mm;bottom:2mm;width:5.2mm;height:5.2mm;z-index:5;
  border-radius:1.2mm;border:.55mm solid rgba(0,0,0,.2);background:rgba(255,255,255,.75);
}
.stage .crd.is-done::after{
  border-color:var(--cat,var(--maroon));background:var(--cat,var(--maroon));
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M1.4 6.3 L4.6 9.3 L10.6 2.6' fill='none' stroke='white' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-size:78%;background-position:center;background-repeat:no-repeat;
}
.stage .crd.is-done{box-shadow:0 0 0 .9mm var(--cat,var(--maroon)) inset,0 .4mm 1.4mm rgba(0,0,0,.12)}
.stage .crd.is-done .crd__body{background:color-mix(in srgb,var(--cat,var(--maroon)) 15%,#fff)}
.stage .crd.is-done .crd__en,.stage .crd.is-done .crd__arname{color:var(--cat,var(--maroon))}
/* the two visiting cards on a major map are general courses — ticked elsewhere */
.stage .crd--gate{pointer-events:none}
.stage .crd--gate::after{display:none}
/* closed off: this group already has its pick, or you chose the other path */
.stage .crd.is-lock{pointer-events:none;opacity:.3;filter:grayscale(.7)}
.stage .crd.is-lock::after{display:none}

/* ---------- plain screens ---------- */
.pan{flex:1;min-height:0;overflow:auto;padding:22px 16px 28px;position:relative}
.pan__in{max-width:960px;margin:0 auto;position:relative}
.measure{max-width:620px}
.h{margin:0;font-family:Aleo,Tajawal,serif;font-weight:700;font-size:26px;line-height:1.2;color:var(--a-ink);
  text-wrap:balance}
.h-ar{font-family:Cairo,sans-serif;font-weight:700;font-size:26px;direction:rtl;text-align:right;
  line-height:1.6;margin:2px 0 10px;color:var(--a-ink)}
.p{font-size:16px;line-height:1.5;color:var(--a-ink2);margin:0}
.p b{color:var(--a-ink)}
.p .arb{font-size:16px;line-height:1.75;margin-top:4px}

/* first screen: the drawing from the printed cover. Every dot is a course and
   every curve a prerequisite, from the same data file; it draws itself once,
   left to right, in the order the courses are taken. */
.hero{margin:-22px -16px 0}
.net{display:block;width:100%;height:104px;pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
.net path{fill:none;stroke:#660000;stroke-width:3.4;stroke-opacity:.4;stroke-dasharray:1;stroke-dashoffset:0}
.net.draw path{animation:draw 1.1s cubic-bezier(.35,.6,.25,1) both}
.net.draw circle{animation:dot .5s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes dot{from{opacity:0}}
.hero__t{padding:4px 16px 0}
.wb{margin-top:18px;padding:14px 16px;border-radius:12px;background:#fff;
  box-shadow:0 0 0 1.5px var(--maroon) inset}
.wb__t{font-family:Aleo,Tajawal,serif;font-weight:700;font-size:17px;color:var(--maroon)}
.wb__t .arb{font-family:Cairo,sans-serif;font-size:17px;line-height:1.6}
.wb .p{margin-top:4px}
.wb .btn{margin-top:12px}
/* a major is drawn as the sheet draws a course: a coloured bar with its
   number, and the long official name in both languages */
.majs{display:grid;gap:12px;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mj{display:block;text-align:left;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);transition:transform .12s}
.mj:active{transform:scale(.99)}
.mj__bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--maroon);
  color:#fff;padding:8px 14px;font-weight:700;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
.mj__bar .arb{font-weight:700;font-size:15px}
.mj__body{display:block;padding:10px 14px 10px}
.mj__en{display:block;font-family:BarlowC,Cairo,sans-serif;font-weight:700;font-style:italic;font-size:23px;
  line-height:1.08;color:var(--maroon);text-wrap:balance}
.mj .mj__ar{font-family:Cairo,sans-serif;font-weight:700;font-size:23px;line-height:1.55;color:var(--maroon);text-wrap:balance}
.mj.on{box-shadow:0 0 0 3px var(--maroon),0 2px 8px rgba(102,0,0,.18)}
.mj__tick{display:none;width:22px;height:22px;border-radius:6px;background:#fff;flex:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M1.4 6.3 L4.6 9.3 L10.6 2.6' fill='none' stroke='%23660000' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-size:74%;background-position:center;background-repeat:no-repeat}
.mj.on .mj__tick{display:block}

/* pace: three plain questions, answered with one row of buttons each */
.q{margin-top:26px;padding-top:18px;border-top:1px solid var(--a-line)}
.q__h{margin:0;font-family:Aleo,Tajawal,serif;font-weight:700;font-size:18px;color:var(--a-ink)}
.q__h .arb{font-family:Cairo,sans-serif;font-size:18px;line-height:1.6}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;min-width:0;min-height:52px;border-radius:10px;border:1.5px solid var(--a-line);background:#fff;
  font-weight:700;font-size:19px;color:var(--a-ink);font-variant-numeric:tabular-nums}
.seg button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.seg--terms{display:grid;grid-template-columns:repeat(2,1fr)}
.seg--terms button{font-size:15px;padding:6px 10px;line-height:1.3}
.seg--terms .arb{text-align:center;font-weight:500;font-size:15px;line-height:1.5}
.cap{margin:10px 0 0;font-size:15px;line-height:1.45;color:var(--a-ink2)}
.cap .arb{font-size:15px;line-height:1.7;margin-top:2px}

/* result: the answer first, then the plan drawn the way the sheet draws a map */
.ans{margin-top:4px;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 3px var(--maroon),0 3px 12px rgba(102,0,0,.14)}
.ans__bar{display:flex;justify-content:space-between;gap:12px;background:var(--maroon);color:#fff;
  padding:10px 16px;font-weight:700;font-size:16px}
.ans__bar .arb{display:inline;font-weight:700;font-size:16px}
.ans__body{padding:10px 16px 12px}
.ans__en{font-family:BarlowC,Cairo,sans-serif;font-weight:700;font-style:italic;font-size:56px;line-height:1;
  color:var(--maroon)}
.ans__ar{font-family:Cairo,sans-serif;font-weight:700;font-size:56px;line-height:1.55;color:var(--maroon);
  direction:rtl;text-align:right}
.sum{margin:16px 0 0}
.plan{margin-top:22px;display:grid;gap:12px}
.tb{border-radius:12px;padding:0 0 12px;background:rgba(102,0,0,calc(.03 + var(--k) * .09))}
.tb__h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 14px 9px}
.tb__en{font-family:Aleo,Tajawal,serif;font-weight:700;font-size:17px;color:var(--a-ink)}
.tb__ar{font-family:Cairo,sans-serif;font-weight:700;font-size:17px;color:var(--a-ink);direction:rtl}
.tb__cards{display:grid;gap:8px;padding:0 12px;grid-template-columns:1fr}
.tb--cap{box-shadow:0 0 0 3px var(--maroon)}
.tb--cap .tb__h{background:var(--maroon);border-radius:12px 12px 0 0;margin-bottom:12px}
.tb--cap .tb__en,.tb--cap .tb__ar{color:#fff}
.pc{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.07)}
.pc__bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bar);
  color:#fff;padding:5px 10px;font-weight:700;font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums}
.pc__bar .arb{font-weight:700;font-size:15px;line-height:1.35}
.pc__body{display:block;padding:8px 10px 9px}
.pc__en{display:block;font-family:Aleo,Tajawal,serif;font-weight:700;font-size:15px;line-height:1.3;color:var(--a-ink)}
.pc .pc__ar{font-family:Tajawal,sans-serif;font-weight:500;font-size:15px;line-height:1.6;color:var(--a-ink2)}
/* a course the plan chose for you: dashed, in the colour of its group, and
   saying so in both languages */
.pc--sug{box-shadow:none;outline:2px dashed var(--bar);outline-offset:-2px}
.pc__tag{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 10px;padding:6px 0 8px;
  border-top:1px dashed var(--a-line);font-size:14px;line-height:1.4;color:var(--a-ink2)}
.pc__tag .arb{font-size:14px;line-height:1.4}
.nt{margin:22px 0 0;padding:12px 14px;border-left:4px solid var(--maroon);background:#fff;border-radius:0 10px 10px 0;
  font-size:15px;line-height:1.5;color:var(--a-ink)}
.nt .arb{font-size:15px;line-height:1.7;margin-top:4px;color:var(--a-ink2)}
.ftr{margin-top:26px;padding-top:14px;border-top:1px solid var(--a-line);font-size:14px;line-height:1.55;color:var(--a-ink2)}
.ftr b{color:var(--a-ink)}
.ftr .arb{font-size:14px;line-height:1.7}

/* bottom bar */
.nv{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--a-line);z-index:30}
.btn{min-height:52px;padding:7px 18px;border-radius:10px;font-weight:700;font-size:15px;background:var(--maroon);
  color:#fff;line-height:1.25;transition:opacity .12s;text-align:center;flex:none}
.btn:disabled{opacity:.35;cursor:default}
.btn--g{background:#fff;color:var(--maroon);box-shadow:0 0 0 1.5px var(--a-line) inset}
.btn .arb{font-size:15px;font-weight:500;line-height:1.5;text-align:center}
.st{flex:1;min-width:0;font-size:15px;color:var(--a-ink2);line-height:1.3;font-variant-numeric:tabular-nums}
.st b{color:var(--maroon);font-size:17px}
.st .arb{font-size:14px;line-height:1.5;text-align:left}

@media (min-width:640px){
  .tb__cards{grid-template-columns:repeat(2,1fr)}
  .pan{padding:28px 24px 32px}
  .hero{margin:-28px -24px 0}
  .net{height:140px}
  .hero__t{padding:4px 24px 0}
}
/* wide screens: the cover's own arrangement, words on the left and the
   drawing on the right, and the title on one centre line as on the sheet */
@media (min-width:900px){
  .ap__sp{display:block;width:var(--lw,82px)}
  .hero{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:24px}
  .hero__t{padding:0;order:0}
  .net{order:1;height:300px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%);mask-image:linear-gradient(90deg,transparent,#000 22%)}
  .net path{stroke-width:2.2}
  .h,.h-ar{font-size:34px}
}
@media (min-width:1000px){ .tb__cards{grid-template-columns:repeat(3,1fr)} }
@media (max-width:400px){
  .ap{padding:8px 12px 6px;gap:10px}.ap__logo{height:38px}
  .ap__en,.ap .ap__ar{font-size:19px}
  .bar{padding:0 12px 8px}
  .btn{padding:7px 12px}
  .nv{padding-left:12px;padding-right:12px;gap:6px}
  .ans__en,.ans__ar{font-size:48px}
}
@media (prefers-reduced-motion:reduce){
  #slot,.mj,.btn,.stage .crd[data-code]{transition:none}
  .net.draw path,.net.draw circle{animation:none}
}
</style>
</head>
<body>
<header class="ap">
  <img class="ap__logo" id="mark" alt="ISOM Club">
  <div class="ap__t" id="ttl"></div>
  <i class="ap__sp" aria-hidden="true"></i>
</header>
<div class="bar" id="bar" aria-hidden="true"></div>
<main id="main"><div id="slot"></div></main>
<nav class="nv" id="nv"></nav>

<script id="PAGES" type="application/json">__PAGES__</script>
<script id="PLAN" type="application/json">__PLAN__</script>
<script id="ASSETS" type="application/json">__ASSETS__</script>
<script id="NET" type="text/html">__NET__</script>
<script id="NETS" type="text/html">__NETSTRIP__</script>
<script>/*__WIREJS__*/</script>
<script>
const PG = JSON.parse(document.getElementById('PAGES').textContent);
const P  = JSON.parse(document.getElementById('PLAN').textContent);
const AS = JSON.parse(document.getElementById('ASSETS').textContent);
{ const mk = document.getElementById('mark');
  /* the empty space on the right matches the mark, so the title sits on the
     page's centre line on a wide screen, as it does on the sheet */
  mk.onload = () => document.documentElement.style.setProperty('--lw', (52 * mk.naturalWidth / mk.naturalHeight).toFixed(1) + 'px');
  mk.src = AS['isom-logo.png']; }

const PW = 594 * 96 / 25.4, PH = 420 * 96 / 25.4;   /* the sheet, in CSS pixels */
const S = { step:0, major:null, done:new Set(), freeDone:0, perTerm:5, summer:2, start:0, z:null };
const STEPS = ['major','general','majormap','electives','pace','result'];
const CO = c => P.courses[c] || {en:c, ar:'', cat:'core', pre:[]};
const PRE = c => { const o = S.major && P.majors[S.major].pre_override; return (o&&o[c]) ? o[c] : (CO(c).pre||[]); };
const phone = () => window.innerWidth < 760;
/* Arabic markup: marked as Arabic for screen readers, right-aligned under the English */
const AR = (t, cls) => '<span class="arb'+(cls?' '+cls:'')+'" lang="ar" dir="rtl">'+t+'</span>';
/* Arabic counts agree with the number, the Latin figure stays a figure:
   1 مقرر واحد · 2 مقرران · 3–10 مقررات · 11+ مقرراً */
const arN = (n, one, two, few, many) =>
  n === 1 ? one : n === 2 ? two : (n % 100 >= 3 && n % 100 <= 10) ? n+' '+few : n+' '+many;
const arCourses = n => arN(n, 'مقرر واحد', 'مقرران', 'مقررات', 'مقرراً');
/* a year count reads "2", not "2.0" */
const yrsFmt = y => Number.isInteger(y) ? String(y) : y.toFixed(1);
/* after "نحو": سنة واحدة · سنتين · 3–10 سنوات · 1.5 سنة */
const arYears = y => !Number.isInteger(y) ? y.toFixed(1)+' سنة دراسية' : y === 1 ? 'سنة دراسية واحدة' :
  y === 2 ? 'سنتين دراسيتين' : (y >= 3 && y <= 10) ? y+' سنوات دراسية' : y+' سنة دراسية';

/* ---------- what is still owed ---------- */
function outstanding(){
  const M = P.majors[S.major], need = [], open = [];
  const used = new Set();
  const all = (cs,w) => cs.forEach(c => { if(!S.done.has(c)) need.push({c,why:w}); });
  const pick = (cs,n,w,cat,shared) => {
    const got = cs.filter(c=>S.done.has(c) && !(shared && used.has(c))).slice(0,n);
    if(shared) got.forEach(c=>used.add(c));
    const left = n - got.length;
    const pool = cs.filter(c=>!S.done.has(c));
    for(let i=0;i<left && i<pool.length;i++) need.push({c:pool[i],why:w,sug:true});
    if(left>pool.length) for(let i=0;i<left-pool.length;i++) open.push({why:w,cat});
  };
  all(P.general,'general');
  all(P.electives.must,'elective');
  P.electives.groups.forEach(g=>pick(g.codes,g.pick,'elective',g.cat,true));
  for(let i=0;i<P.electives.free-S.freeDone;i++) open.push({why:'free',cat:'support'});
  all(M.must,'major');
  if(M.paths.length){
    let best=M.paths[0], sc=-1;
    M.paths.forEach(p=>{const s=(S.done.has(p.top)?2:0)+p.codes.filter(c=>S.done.has(c)).length; if(s>sc){sc=s;best=p;}});
    all([best.top],'major'); pick(best.codes,best.pick,'major',best.cat);
  }
  M.choose.forEach(g=>pick(g.codes,g.pick,'major',g.cat));
  pick(M.support.codes,M.support.pick,'support',M.support.cat);
  return {need,open};
}
function totalSlots(){
  const M=P.majors[S.major];
  return P.general.length + P.electives.must.length + P.electives.groups.length + P.electives.free
    + M.must.length + (M.paths.length ? 1+M.paths[0].pick : 0)
    + M.choose.reduce((a,g)=>a+g.pick,0) + M.support.pick;
}
const TERMS = (()=>{const o=[];for(let y=2026;y<=2070;y++){
  o.push({en:'Fall '+y,ar:'خريف '+y,cap:'n'});
  o.push({en:'Spring '+(y+1),ar:'ربيع '+(y+1),cap:'n'});
  o.push({en:'Summer '+(y+1),ar:'صيف '+(y+1),cap:'s'});}return o;})();

function schedule(){
  const {need,open} = outstanding();
  const passed = new Set(S.done);
  let pool = need.slice(), blank = open.slice();
  const out = []; let ti = S.start, guard = 0;
  while((pool.length||blank.length) && guard++ < 400){
    const T = TERMS[ti++]; if(!T) break;
    const cap = T.cap==='s' ? S.summer : S.perTerm;
    if(cap < 1) continue;
    const ready = pool.filter(x=>{
      const c = CO(x.c);
      if(c.after_credits && passed.size < Math.ceil(c.after_credits/3)) return false;
      return PRE(x.c).every(p=>passed.has(p));
    });
    const put = ready.slice(0,cap);
    while(put.length<cap && blank.length) put.push(blank.shift());
    if(!put.length){ if(!pool.length) break; out.push({T,list:[],stuck:true}); break; }
    put.forEach(x=>{ if(x.c){ passed.add(x.c); pool = pool.filter(y=>y!==x); } });
    out.push({T,list:put});
  }
  return out;
}

/* Every "PICK 1", "PICK 3", "TAKE BOTH" printed on a sheet is a rule the app
   now holds you to: once a group is full the rest of it locks, and choosing a
   path closes the other one. Untick and they open again. */
let GS = [];
function groupsFor(map){
  if(map === 'electives') return P.electives.groups.map(g => ({codes:g.codes, max:g.pick, shared:true}));
  const M = P.majors[map]; if(!M) return [];
  const out = [];
  M.paths.forEach(p => out.push({codes:p.codes, max:p.pick}));
  M.choose.forEach(g => out.push({codes:g.codes, max:g.pick}));
  out.push({codes:M.support.codes, max:M.support.pick});
  return out.filter(g => g.max < g.codes.length);      /* take-all needs no lock */

function tagGroups(){
  const els = [...document.querySelectorAll('.stage .crd[data-code]')];
  const taken = new Set();
  GS.forEach((g, gi) => g.codes.forEach(code => {
    const el = els.find(e => !taken.has(e) && e.dataset.code === code);
    if(el){ taken.add(el); el.dataset.grp = gi; }
  }));
}
/* a course that sits in two groups is credited to one of them, as the sheet's
   own footnote says: it counts once */
function fullness(){
  const used = new Set();
  return GS.map(g => {
    const got = g.codes.filter(c => S.done.has(c) && !(g.shared && used.has(c))).slice(0, g.max);
    if(g.shared) got.forEach(c => used.add(c));
    return got.length >= g.max;
  });
}
function deadPath(){
  const M = S.major && P.majors[S.major];
  if(mapName() !== S.major || !M || M.paths.length !== 2) return null;
  const on = M.paths.map(p => [p.top].concat(p.codes).some(c => S.done.has(c)));
  if(on[0] && !on[1]) return 1;
  if(on[1] && !on[0]) return 0;
  return null;
}
function applyLocks(){
  const full = fullness(), dp = deadPath();
  const M = S.major && P.majors[S.major];
  const shut = dp === null ? [] : [M.paths[dp].top].concat(M.paths[dp].codes);
  document.querySelectorAll('.stage .crd[data-code]').forEach(e => {
    const c = e.dataset.code, done = S.done.has(c);

    e.classList.toggle('is-lock', lock);

}

/* The sheet's own Arabic is marked as Arabic in place, so a screen reader
   reads it in an Arabic voice. Nothing moves: an Arabic run inside an English
   line is wrapped in a span, an all-Arabic element just gets the attribute. */
const ARCH = '؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿';
const IS_AR = new RegExp('['+ARCH+']'), IS_LAT = /[A-Za-z]/;
const AR_RUN = new RegExp('['+ARCH+'](?:[\\s ‌-‏0-9.,:;()«»\\-–—·'+ARCH+']*['+ARCH+'])?','g');
function markArabic(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t => {
    const v = t.nodeValue, el = t.parentElement;
    if(!el || !IS_AR.test(v) || el.closest('[lang="ar"],svg,script,style')) return;
    const own = [...el.childNodes].filter(n => n.nodeType === 3 && n.nodeValue.trim());
    if(!own.some(n => IS_LAT.test(n.nodeValue)) && el.children.length === 0){ el.setAttribute('lang','ar'); return; }
    const frag = document.createDocumentFragment(); let last = 0;
    v.replace(AR_RUN, (m, i) => {
      if(i > last) frag.appendChild(document.createTextNode(v.slice(last, i)));
      const s = document.createElement('span'); s.setAttribute('lang','ar'); s.textContent = m; frag.appendChild(s);
      last = i + m.length; return m;
    });
    if(last < v.length) frag.appendChild(document.createTextNode(v.slice(last)));
    t.replaceWith(frag);
  });
}

function firstCardIn(b){

function jumpTo(which, smooth){
  const st = document.querySelector('.stage'); if(!st) return;

  if(!el) return;
  const e = el.getBoundingClientRect(), s = st.getBoundingClientRect();
  let left = st.scrollLeft + (e.left - s.left) - 8;
  const top = st.scrollTop + (e.top - s.top) - 8;

  if(smooth === false){ st.scrollLeft = Math.max(0,left); st.scrollTop = Math.max(0,top); }

function tickAllLegal(){

    AR('اختياري حر')+'</div><div class="pc__body"><span class="pc__en">Any course you choose, from anywhere in the university</span>'+
    AR('أي مقرر تختاره، من أي مكان في الجامعة','pc__ar')+'</div></div>';
  const c = CO(x.c);
  return '<div class="pc '+(x.sug?'pc--sug':'')+'" style="--bar:'+barOf(c.cat)+'">'+
    '<div class="pc__bar"><span>'+x.c+'</span></div>'+
    '<div class="pc__body"><span class="pc__en">'+c.en+'</span>'+AR(c.ar,'pc__ar')+'</div>'+
    (x.sug ? '<div class="pc__tag"><span>Suggested</span>'+AR('مقترح')+'</div>' : '')+'</div>';
}
function screenResult(){
  const pl = schedule(), o = outstanding();
  const left = o.need.length+o.open.length, total = totalSlots(), got = total-left;
  if(!left) return '<div class="pan"><div class="pan__in measure"><h1 class="h">You are done.</h1>'+
    AR('لقد أنهيت كل شيء.','h-ar')+'<p class="p">All '+total+' courses are ticked. Go and see your advisor about graduating.'+
    AR('جميع المقررات الـ'+total+' مكتملة. راجع مرشدك الأكاديمي بخصوص التخرج.')+'</p></div></div>';
  const last = pl.length ? pl[pl.length-1].T : TERMS[S.start];
  const nNorm = pl.filter(t=>t.T.cap==='n').length, nSum = pl.length - nNorm;
  const yrs = nNorm/2;
  const anySug = pl.some(t => t.list.some(x => x.sug));
  const n = pl.length;
  /* "4 semesters and 1 summer", counted the way a student counts them */
  const terms = [nNorm ? nNorm+' '+(nNorm===1?'semester':'semesters') : '',
                 nSum ? nSum+' '+(nSum===1?'summer':'summers') : ''].filter(Boolean).join(' and ');
  const termsAr = [nNorm ? arN(nNorm,'فصل عادي واحد','فصلان عاديان','فصول عادية','فصلاً عادياً') : '',
                   nSum ? arN(nSum,'صيف واحد','صيفان','فصول صيفية','فصلاً صيفياً') : ''].filter(Boolean).join(' و');
  const about = nNorm >= 2 ? ', about '+yrsFmt(yrs)+' academic '+(yrs===1?'year':'years') : '';
  const aboutAr = nNorm >= 2 ? '، أي نحو '+arYears(yrs) : '';
  return '<div class="pan"><div class="pan__in">'+
   '<section class="ans measure" aria-label="Your graduation term">'+
     '<div class="ans__bar"><span>You graduate in</span>'+AR('موعد تخرجك')+'</div>'+
     '<div class="ans__body"><div class="ans__en">'+last.en+'</div>'+AR(last.ar,'ans__ar')+'</div></section>'+
   '<p class="p sum measure">You have <b>'+left+'</b> of '+total+' courses left. At '+S.perTerm+' a semester'+
     (S.summer?' and '+S.summer+' each summer':', skipping summers')+', that is '+terms+about+'.'+
     AR('بقي لك '+left+' من '+total+' مقرراً. بدراسة '+S.perTerm+' في الفصل'+
     (S.summer?' و'+S.summer+' في كل صيف':' وتخطي الصيف')+'، يبقى '+termsAr+aboutAr+'.')+'</p>'+
   (anySug ? '<p class="cap measure">A dashed card is our suggestion. You can swap it for another course from the same group on your map.'+
     AR('البطاقة ذات الإطار المتقطع اقتراح منا. يمكنك استبدالها بمقرر آخر من المجموعة نفسها على خريطتك.')+'</p>' : '')+
   '<div class="plan">'+pl.map((t,i)=>{
     const capst = i === n-1;
     return '<section class="tb '+(capst?'tb--cap':'')+'" style="--k:'+(n>1?(i/(n-1)).toFixed(3):1)+'">'+
       '<header class="tb__h"><span class="tb__en">'+t.T.en+(capst?' — you graduate':'')+'</span>'+
       AR(t.T.ar+(capst?' — تتخرج':''),'tb__ar')+'</header>'+
       '<div class="tb__cards">'+t.list.map(card).join('')+'</div></section>';
   }).join('')+'</div>'+
   '<p class="nt measure">This plan follows the prerequisite lines drawn on your map, and assumes every course is offered in the term it lands in. Always check your own plan in the portal before you register.'+
   AR('يتبع هذا المخطط المتطلبات السابقة المرسومة على خريطتك، ويفترض أن كل مقرر يُطرح في الفصل الذي وُضع فيه. راجع خطتك في نظام التسجيل قبل كل تسجيل.')+'</p>'+
   '<footer class="ftr measure"><b>ISOM Club</b>, Kuwait University, College of Business Administration. '+
   'Built from the club\'s 2026/2027 student guide.'+
   AR('<b>نادي نظم المعلومات وإدارة العمليات</b>، جامعة الكويت، كلية العلوم الإدارية. مبني على دليل الطالب 2026/2027 الصادر عن النادي.')+'</footer>'+
   '</div></div>';
}

/* ---------- chrome ---------- */
const dec = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; };
function sheetTitle(n){
  const h = PG[n].html;
  return { en: dec((h.match(/class="hd__en">([^<]*)</) || [])[1]), ar: dec((h.match(/class="hd__ar">([^<]*)</) || [])[1]) };
}
function title(){
  const st = STEPS[S.step];
  if(st === 'major')  return {en:'When do I graduate?', ar:'متى أتخرج؟'};
  if(st === 'pace')   return {en:'Your pace', ar:'سرعة دراستك'};
  if(st === 'result') return {en:'Your plan', ar:'خطتك'};
  return sheetTitle(mapName());
}
function nav(){
  const st = STEPS[S.step], last = S.step===STEPS.length-1;
  let mid = '';
  if(st==='general'||st==='majormap'||st==='electives'){
    /* counted against what this sheet asks of you — "3 / 9" on the electives,
       not "3 / 37": a group you pick one from counts once */
    const need = mapNeeded(), left = mapLeft(), on = need - left;
    const allOn = left === 0;
    mid = '<span class="st"><b>'+on+'</b> / '+need+AR('مجتاز')+'</span>'+
      '<button class="btn btn--g" data-all="'+(allOn?0:1)+'">'+(allOn?'Clear'+AR('امسح'):'Tick all'+AR('حدد الكل'))+'</button>';
  } else if(st==='pace'){ const o=outstanding(); mid='<span class="st"><b>'+(o.need.length+o.open.length)+'</b> left'+
    AR('باقٍ')+'</span>'; }
  else mid = '<span class="st"></span>';
  return (S.step?'<button class="btn btn--g" id="back">Back'+AR('رجوع')+'</button>':'')+mid+
    (last ? '<button class="btn btn--g" id="again">Start again'+AR('ابدأ من جديد')+'</button>'
          : '<button class="btn" id="next" '+((st==='major'&&!S.major)?'disabled':'')+'>'+
            (S.step===4?'Show me'+AR('أرني النتيجة'):'Next'+AR('التالي'))+'</button>');
}
function paint(){
  const st = STEPS[S.step], m = mapName();
  if(m) mountMap(m);
  else document.getElementById('slot').innerHTML =
    st==='major' ? screenMajor() : st==='pace' ? screenPace() : screenResult();
  document.getElementById('nv').innerHTML = nav();
  const t = title();
  document.getElementById('ttl').innerHTML = '<span class="ap__en">'+t.en+'</span>'+AR(t.ar,'ap__ar');
  document.getElementById('bar').innerHTML = STEPS.map((_,i)=>'<i class="'+(i<=S.step?'on':'')+'"></i>').join('');
  markArabic(document.getElementById('slot'));
}
/* an answer on the same screen redraws it where you are, not back at the top */
function repaint(){
  const p = document.querySelector('.pan'), y = p ? p.scrollTop : 0;
  render();
  const q = document.querySelector('.pan'); if(q) q.scrollTop = y;
}
function render(go){
  save();
  const slot = document.getElementById('slot');
  if(go===undefined){ paint(); return; }
  slot.classList.add('fade');
  setTimeout(()=>{ S.step = go; S.z = null; paint(); slot.classList.remove('fade');
    const p = slot.querySelector('.pan'); if(p) p.scrollTop = 0; }, 170);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const z = e.target.closest('[data-z]');
  if(z){ const st = document.querySelector('.stage'), old = S.z;
    S.z = Math.min(1.6, Math.max(0.28, S.z + (z.dataset.z==='+'?0.15:-0.15)));
    /* keep the middle of the view in the middle */
    const cx = (st.scrollLeft + st.clientWidth/2) / old, cy = (st.scrollTop + st.clientHeight/2) / old;
    applyZoom(); st.scrollLeft = cx*S.z - st.clientWidth/2; st.scrollTop = cy*S.z - st.clientHeight/2;
    return; }
  const chip = e.target.closest('[data-band]');
  if(chip) return jumpTo(chip.dataset.band);
  const crd = e.target.closest('.stage .crd[data-code]');
  if(crd){ const c=crd.dataset.code;
    S.done.has(c) ? S.done.delete(c) : S.done.add(c);
    crd.classList.toggle('is-done', S.done.has(c)); save();
    if(!HINTED){ HINTED = true; const h = document.getElementById('hint'); if(h) h.remove(); }
    return syncTicks(); }
  const fr = e.target.closest('[data-fr]');
  if(fr){ S.freeDone = +fr.dataset.fr; save(); return syncTicks(); }
  const a = e.target.closest('[data-all]');
  if(a){ const el = mapName() === 'electives';
    if(a.dataset.all==='1'){ tickAllLegal(); if(el) S.freeDone = P.electives.free; }
    else { mapCodes().forEach(c=>S.done.delete(c)); if(el) S.freeDone = 0; }
    save(); return syncTicks(); }
  const t = e.target.closest('[data-m],[data-p],[data-s],[data-t],#next,#back,#again,#resume');
  if(!t) return;
  if(t.dataset.m){ S.major=t.dataset.m; return repaint(); }
  if(t.dataset.p){ S.perTerm=+t.dataset.p; return repaint(); }
  if(t.dataset.s){ S.summer=+t.dataset.s; return repaint(); }
  if(t.dataset.t){ S.start=+t.dataset.t; return repaint(); }
  if(t.id==='resume'){ const go = Math.min(5, Math.max(1, S.resume || 5)); S.resume = 0; return render(go); }
  if(t.id==='next') return render(S.step+1);
  if(t.id==='back') return render(S.step-1);
  if(t.id==='again'){ S.done=new Set(); S.freeDone=0; S.major=null; S.resume=0; return render(0); }
});
let rz, rzWide = window.innerWidth >= 900;
addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  if(mapName()){ S.z=fitZoom(); applyZoom(); }
  /* the first screen's drawing is cut for the screen's shape */
  const wide = window.innerWidth >= 900;
  if(wide !== rzWide && STEPS[S.step] === 'major') repaint();
  rzWide = wide; },180); });

/* ---------- remembered on this device only ---------- */
const KEY='isom-graduate-v2';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({major:S.major,done:[...S.done],
  freeDone:S.freeDone,perTerm:S.perTerm,summer:S.summer,start:S.start,step:S.step})); }catch(e){} }
(function load(){ try{ const v=JSON.parse(localStorage.getItem(KEY)||'null'); if(!v) return;
  if(v.major&&P.majors[v.major]) S.major=v.major;
  if(Array.isArray(v.done)) S.done=new Set(v.done.filter(c=>P.courses[c]));
  if(typeof v.freeDone==='number') S.freeDone=Math.min(2,Math.max(0,v.freeDone));
  if(typeof v.perTerm==='number') S.perTerm=Math.min(6,Math.max(1,v.perTerm));
  if(typeof v.summer==='number') S.summer=Math.min(3,Math.max(0,v.summer));
  if(typeof v.start==='number') S.start=Math.min(3,Math.max(0,v.start));
  if(typeof v.step==='number' && S.major) S.resume=Math.min(5,Math.max(0,v.step));
}catch(e){} })();

if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(mapName()) { mountMap(mapName()); } });
paint();
</script>
